<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1417">
<title>Metin Timer</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Metin Timer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@500;700;900&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: sticky top bar + scrollable map tabs; each map shows its respawn spots as rows, channels CH1–CH5/6 left to right. Dark only — a night-time game tool. */
:root{
  --bg:#0f1417; --surface:#182026; --surface-2:#202a31; --rule:#2b3740;
  --fg:#e7ece9; --muted:#8c9b98; --accent:#c8955a; --accent-ink:#1b130a;
  --wait:#9fb4c4; --window:#e8c24a; --ready:#4fd39b; --over:#4ea3e8; --danger:#ef6a5b;
  --f-ui:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-num:"Chivo Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-ui);font-size:17px;line-height:1.35;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 0;display:grid;gap:8px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.ctrls{display:flex;align-items:center;gap:inherit;flex-wrap:wrap;min-width:0}
header{grid-template-columns:minmax(0,1fr)}
.brand{font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;margin-right:auto}
@media (max-width:520px){.brand{flex-basis:100%}}
.radio{display:flex;align-items:center;gap:2px;min-width:250px;flex:1 1 260px;max-width:360px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:3px}
.radio .rbtn{display:grid;place-items:center;width:32px;height:32px;flex:0 0 auto;background:none;border:0;border-radius:6px;color:var(--fg)}
.radio .rbtn:hover{background:var(--surface-2)}
.radio .rvoln{width:42px;flex:0 0 auto;background:var(--bg);border:1px solid var(--rule);border-radius:5px;padding:2px 3px;font-family:var(--f-num);font-size:13px;text-align:center;margin-right:4px;-moz-appearance:textfield}
.radio .rvoln::-webkit-inner-spin-button,.radio .rvoln::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.radio .rvol{width:52px;flex:0 0 auto;accent-color:var(--accent);margin:0 4px 0 0;min-height:28px}
@media (max-width:520px){.radio .rvol{width:72px}}
.radio .rtitle{flex:1;min-width:0;overflow:hidden;white-space:nowrap;font-size:14px;color:var(--fg);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.radio .rtitle span{display:inline-block;padding-left:2px}
.radio.off .rtitle{color:var(--muted)}
.radio.off [data-radio="on"]{color:var(--ready)}
@media (prefers-reduced-motion:no-preference){.radio:not(.off) .rtitle span{animation:marq 14s linear infinite}}
@keyframes marq{0%,15%{transform:translateX(0)}85%,100%{transform:translateX(min(0px,calc(-100% + 160px)))}}
.ytdock{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:12;width:200px;height:200px;border-radius:8px;overflow:hidden;border:1px solid var(--rule);box-shadow:0 8px 24px rgba(0,0,0,.45);background:#000}
.ytdock iframe{width:200px;height:200px;display:block}
.rq li{padding:2px 3px 2px 6px;min-width:0;font-size:14px}
.rq{gap:4px}
.rq li.rqmore{background:none;border:0;padding:0;justify-content:center;font-size:13px}
.rqtoggle{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 8px}
.raadd{display:flex;gap:8px;min-width:0}
.raadd input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;min-height:40px}
.rq li.rnow{border-color:var(--accent)}
.rqplay{flex:1;min-width:0;text-align:left;background:none;border:0;padding:4px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rq .btn{min-height:28px;padding:0 9px;flex:0 0 auto}
@media (max-width:520px){.radio{flex:1 1 100%;max-width:none}}
.brand small{display:block;font-size:12px;font-weight:500;letter-spacing:.12em;color:var(--muted)}
.people{position:relative;display:inline-flex;align-items:center;gap:5px;min-height:38px;padding:0 10px;border:1px solid var(--rule);border-radius:6px;background:var(--surface-2);color:var(--ready);font-family:var(--f-num);font-weight:700;cursor:default}
.people .plist{display:none;position:absolute;top:calc(100% + 6px);right:0;z-index:15;min-width:170px;max-height:60vh;overflow:auto;margin:0;padding:8px 0;list-style:none;background:var(--surface);border:1px solid var(--rule);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.4);font-family:var(--f-ui);font-weight:600;color:var(--fg)}
.people .plist li{padding:5px 14px;white-space:nowrap}
.people .pme{color:var(--muted);font-weight:500}
.gfloat{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:19;width:min(360px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow-y:auto;overflow-x:hidden;background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.55);padding:0 14px 12px;display:grid;gap:8px;text-align:center}
.gresize{position:absolute;right:0;bottom:0;width:22px;height:22px;padding:0;border:0;background:none;cursor:nwse-resize;touch-action:none;z-index:2}
.gresize::before{content:"";position:absolute;right:4px;bottom:4px;width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);border-radius:0 0 3px 0;opacity:.8}
.gresize:hover::before{border-color:var(--fg)}
.gfloat.moving{opacity:.9;box-shadow:0 16px 40px rgba(0,0,0,.7)}
.gfloat p{margin:0;color:var(--muted);font-size:15px}
.ghead{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;margin:0 -14px;padding:8px 8px 8px 14px;background:var(--surface-2);border-bottom:1px solid var(--rule);cursor:move;touch-action:none;user-select:none}
.ghead h2{flex:1;margin:0;font-size:17px;text-align:left}
.ghead .pme{font-size:13px}
.ghead .gx{background:none;border:1px solid var(--rule);border-radius:6px;color:var(--muted);min-width:32px;min-height:30px;font-size:15px;cursor:pointer}
.ghead .gx:hover{color:var(--fg);border-color:var(--muted)}
.gfloat.wide{width:min(520px,calc(100vw - 24px))}
canvas.htrack{width:100%;display:block;border-radius:8px}
.hpick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.hbtn{display:grid;gap:0;justify-items:center;padding:3px 2px;border:2px solid var(--rule);border-radius:8px;background:var(--surface-2);color:var(--fg);cursor:pointer;min-height:40px}
.hbtn b{width:22px;height:22px;border-radius:50%;background:var(--hc);color:#111;display:grid;place-items:center;font-size:13px}
.hbtn i{font-style:normal;font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hbtn span{font-size:11px;color:var(--muted);font-family:var(--f-num)}
.hbtn[aria-pressed="true"]{border-color:var(--hc);background:color-mix(in srgb,var(--hc) 18%,var(--surface-2))}
.hdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--hc);margin-right:5px;vertical-align:middle}
.kick{background:none;border:0;color:var(--danger);cursor:pointer;font-size:13px;padding:0 2px;margin-left:4px;line-height:1}
.kick:hover{color:var(--fg)}
.autoline{color:var(--fg)!important;background:color-mix(in srgb,var(--accent) 18%,transparent);border:1px solid var(--accent);border-radius:8px;padding:5px 8px}
.abody{display:grid;gap:12px}.abody[hidden]{display:none}
.gfloat.mid{width:min(400px,calc(100vw - 24px))}
.wpick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.wbtn{display:grid;gap:1px;justify-items:center;padding:6px 4px;border:2px solid var(--rule);border-radius:8px;background:var(--surface-2);color:var(--fg);cursor:pointer}
.wbtn b{display:block;width:100%;padding:3px 0;border-radius:5px;background:var(--wc);color:#fff;font-size:14px}
.wbtn span{font-size:11px;color:var(--muted);font-family:var(--f-num)}
.wbtn[aria-pressed="true"]{border-color:var(--accent)}
.hbets{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.hchip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border:1px solid var(--rule);border-radius:999px;font-size:13px;background:var(--surface-2)}
.hchip b{color:var(--hc)}.hchip .hdot{background:var(--hc);margin:0}
.hchip.me{border-color:var(--hc)}
.hact{display:flex;align-items:center;justify-content:center;gap:10px}
.hact .btn{flex:1;min-height:38px}
.gfloat .hnote{font-size:12.5px}
.gfloat .acts{margin:0}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:14px;padding:0 2px}
.hlead:empty{display:none}
.hlead{min-height:22px;font-size:15px;margin:-2px 0!important}
.reflexbtn.watch{display:grid;place-items:center;min-height:120px}
.spinbox{text-align:center}
.spinnames{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:6px 0}
.spn{padding:8px 14px;border:1px solid var(--rule);border-radius:999px;font-weight:700;font-size:17px;background:var(--bg);transition:background .08s,color .08s}
.spn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.spn.win{background:var(--ready);color:#06210f;border-color:var(--ready);transform:scale(1.12)}
.spinres{font-size:18px;color:var(--fg)!important;min-height:28px}
.spinres.done b{color:var(--ready)}
.gamebox .gbody{display:grid;gap:8px}
.gline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;border:1px solid var(--rule);border-radius:6px;text-align:left}
.gline>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gline>span.pme{flex:0 0 auto;font-size:14px}
.grow2{display:grid;gap:6px}
.dice{font-size:30px;line-height:1;margin-left:auto;letter-spacing:2px}
.coin{width:110px;height:110px;margin:6px auto;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:700;background:var(--window);color:#2a2000;border:4px solid #b8962e}
.coin.spinning{animation:coinflip .35s linear infinite;font-size:0}
@keyframes coinflip{0%{transform:scaleX(1)}50%{transform:scaleX(.08)}100%{transform:scaleX(1)}}
.reflexbtn{width:100%;min-height:180px;border-radius:10px;border:0;font-size:24px;font-weight:700;cursor:pointer}
.reflexbtn.wait{background:var(--danger);color:#fff}
.reflexbtn.go{background:var(--ready);color:#06210f}
.dbtn{width:100%}
.dme{font-size:16px}.pos{color:var(--ready)}.neg{color:var(--danger)}
.dlog li{font-size:14px;align-items:flex-start}
.gamelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dicebtn{width:100%;min-height:56px;font-size:19px}
.rpsbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.rpsbtns .btn{flex:1;min-width:90px}
.bignum{font-size:26px;color:var(--ready)}
.field .rlp{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;cursor:pointer;text-transform:none;letter-spacing:normal;font-size:16px;font-weight:600;color:var(--fg)}
.field .rlp input{flex:0 0 auto;width:20px;height:20px;min-height:0;padding:0;margin:0;accent-color:var(--ready)}
#rl_p li,#rl_h li{padding:6px 10px}
.banlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.banlist li{min-width:0;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:6px 6px 6px 12px;font-weight:600}
.banlist .btn{min-height:32px;padding:4px 10px}
.banlist .pme{color:var(--muted);font-weight:500;font-size:14px}
.banlist li.pme{background:none;border:0;padding:0}
.people:hover .plist,.people:focus-within .plist,.people.open .plist{display:block}
.roomsel.on{border-color:var(--ready);color:var(--ready)}
.roomsel{background:var(--surface-2);border:1px solid var(--rule);border-radius:6px;min-height:38px;padding:4px 8px;max-width:150px}
.mode{font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--rule);border-radius:4px;color:var(--muted)}
.mode.on{color:var(--ready);border-color:var(--ready)}
.mode.err{color:var(--danger);border-color:var(--danger)}
.btn{background:var(--surface-2);border:1px solid var(--rule);border-radius:6px;padding:6px 12px;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
#wikiBtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--rule))}
.icon{min-width:42px;padding:6px 8px;font-weight:700}

.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;border-bottom:1px solid var(--rule);padding-bottom:0}
.tab{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:8px 10px 6px;color:var(--muted);font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab.mine{color:var(--accent)}
.tab.mine[aria-selected="true"]{color:var(--fg)}
.tab.mine::after{content:"";width:1px;height:18px;background:var(--rule);margin-left:8px}
.badge{font-family:var(--f-num);font-size:12px;border-radius:9px;padding:0 6px;background:var(--surface-2);color:var(--muted)}
.badge.ready{background:var(--over);color:#04192b}

main{padding-top:14px;display:grid;gap:14px}
.maphead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.maphead h1{font-size:26px;margin:0;letter-spacing:.02em;text-wrap:balance}
.ranges{font-family:var(--f-num);font-size:13px;color:var(--muted)}
.spots{display:grid;gap:8px;zoom:var(--zoom,1)}
.zoomrow{display:flex;align-items:center;gap:10px}
.zoomrow input[type=range]{flex:1;accent-color:var(--accent);min-height:32px}
.zoomrow output{font-family:var(--f-num);font-size:14px;min-width:44px;text-align:right}
.spot{display:grid;gap:10px;background:var(--surface);border:1px solid var(--rule);border-left:5px solid var(--c,var(--rule));border-radius:8px;padding:10px 12px}
/* a coloured resp also gets a top bar and a faint tint behind its name, so neighbours are easy to tell apart */
.spot.colored{border-top:4px solid var(--c);border-color:color-mix(in srgb,var(--c) 45%,var(--rule));border-left-color:var(--c);border-top-color:var(--c);background:linear-gradient(to bottom,color-mix(in srgb,var(--c) 16%,var(--surface)),var(--surface) 64px)}
@container pane (min-width:700px){.spot{grid-template-columns:minmax(200px,250px) minmax(0,1fr);align-items:center;gap:14px}}
.panes{display:grid;gap:26px}
.pane{container:pane / inline-size;display:grid;gap:12px;min-width:0}
.mineview .pane+.pane{border-top:1px solid var(--rule);padding-top:16px}
.mineview .maphead h1{font-size:22px}

.shead{display:grid;gap:6px;min-width:0}
.shead .nm{background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 6px;margin:-4px -6px;font-weight:700;font-size:19px;width:calc(100% + 12px);min-width:0}
.shead .nm:hover{border-color:var(--rule)}
.shead .nm:focus{border-color:var(--accent);background:var(--bg);outline:none}
.srow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--rule);border-radius:4px;padding:1px 6px}
.tag.boss{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,var(--rule))}
.srow input{width:52px;background:var(--bg);border:1px solid var(--rule);border-radius:5px;padding:3px 6px;font-family:var(--f-num);font-size:14px;text-align:center}
@media (max-width:420px){
  .bar{gap:6px}.btn{padding:6px 9px}.icon{min-width:34px;padding:6px 4px}.mode{font-size:11px;padding:3px 6px}
  .srow{gap:4px}.srow input{width:40px;padding:3px 2px}.srow .mini{min-width:28px;padding:0 4px}.srow .more{padding:2px 7px}.tag{padding:1px 4px}
  .ranges{font-size:12px}
}
/* phones: keep the whole top bar (room, people, undo/redo, MiniWiki, Gry, Menu) on one line */
@media (max-width:760px){
  .ctrls{flex:1 1 100%;flex-wrap:nowrap}
  .ctrls>*{flex:0 1 auto;min-width:0}
  .ctrls>.btn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctrls>.people{flex-shrink:0}
  .ctrls>.mode,.ctrls>.roomsel{flex-shrink:30;min-width:44px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
@media (max-width:440px){
  .ctrls>.btn,.ctrls>.people{padding:4px 7px;min-height:34px;font-size:15px}
  .ctrls>.icon{min-width:28px;padding:4px 2px}
  .ctrls>.people{gap:3px}.ctrls>.people svg{width:14px;height:14px}
  .ctrls>.mode{font-size:10px;padding:2px 5px;letter-spacing:.03em;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ctrls{gap:5px}
}
@media (max-width:400px){
  .ctrls>.btn,.ctrls>.people{padding:3px 5px;font-size:13.5px}
  .ctrls>.icon{min-width:24px;padding:3px 1px}
  .ctrls>.mode{max-width:64px;padding:2px 4px}
  .ctrls{gap:3px}
}
.srow .sur{margin-left:auto;display:flex;gap:4px}
.srow .mini{background:none;border:1px solid var(--rule);border-radius:5px;color:var(--muted);min-height:30px;min-width:34px;padding:0 6px;font-weight:700}
.srow .mini:hover:not(:disabled){color:var(--fg);border-color:var(--muted)}
.srow .mini:disabled{opacity:.3;cursor:default}
.srow .more{background:none;border:1px solid var(--rule);border-radius:5px;padding:2px 10px;color:var(--muted);min-height:30px}
.srow .more:hover{color:var(--fg);border-color:var(--muted)}
.cells{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,calc(64px * var(--sw,1))));gap:clamp(3px,1.2cqi,6px);container-type:inline-size}
.cell{display:grid;gap:4px;min-width:0}
.cell .ch{font-size:clamp(10px,calc(14cqi / var(--cols)),12px);letter-spacing:.08em;text-align:center;color:var(--muted)}
.cell .ct{border:1px solid var(--rule);border-radius:6px;aspect-ratio:1/1;width:100%;padding:0 1px;letter-spacing:-.04em;background:var(--surface-2);color:var(--muted);font-family:var(--f-num);font-weight:900;font-size:clamp(11px,calc(24cqi / var(--cols)),calc(18px * var(--sw,1)));font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.cell .ct:hover{border-color:var(--muted)}
.cell.idle .ct{background:var(--ready);color:#06210f;border-color:var(--ready)}
.cell.wait .ct{background:var(--danger);color:#2a0905;border-color:var(--danger)}
.cell.window .ct{background:var(--window);color:#241a00;border-color:var(--window)}
.cell.ready .ct{background:var(--over);color:#04192b;border-color:var(--over)}
.cell .rs{background:none;border:1px solid var(--rule);border-radius:5px;color:var(--muted);font-size:clamp(9px,calc(13cqi / var(--cols)),11px);letter-spacing:.08em;text-transform:uppercase;min-height:26px;padding:0}

<script>
(() => {
"use strict";
/* ---------- data ---------- */
const MAPS = [
  {id:"m1",  name:"Miasta pierwsze",   metin:[11,25], boss:[15,20],  wiki:{metin:"13 (11–25 min)", metinN:"+3 do 13 (10–25 min)", boss:"9 (15–20 min)", bossN:"—"}},

  {id:"wez", name:"Wężowe Pole",       metin:[7,77],  boss:null,     wiki:{metin:"7 (7–77 min)", metinN:"+1 (7–77 min)", boss:"0", bossN:"—"}},
  {id:"kra", name:"Kraina Gigantów",   metin:[7,77],  boss:null,     wiki:{metin:"4 (7–77 min)", metinN:"+1 (7–77 min)", boss:"0", bossN:"—"}},

  {id:"cze", name:"Czerwony Las",      metin:[36,47], boss:[48,52],  wiki:{metin:"4 (36–47 min)", metinN:"+1 do 2 (36–46 min)", boss:"1 (48–52 min)", bossN:"—"}},
];
const ROSY = [
  {n:"Biała", d:"obrona", s:["Pokrzywa → Sok","Sok + Bez → Dok","Dok + Róża → Sam-Bo"], f:"20× Sam-Bo + 10× Butelka → 10× Rosa"},
  {n:"Czerwona", d:"krytyk", s:["Pokrzywa → Sok","Sok + Bez → Dok"], f:"20× Dok + 10× Butelka → 10× Rosa"},
  {n:"Niebieska", d:"atak", s:["Brzoskwinia → Sok","Sok + Bez → Sim","Sim + Róża → Zin"], f:"20× Zin + 10× Butelka → 10× Rosa"},
  {n:"Pomarańczowa", d:"przeszywka", s:["Brzoskwinia → Sok","Sok + Bez → Sim"], f:"20× Sim + 10× Butelka → 10× Rosa"},
  {n:"Zielona", d:"magia", s:["Kaki → Sok","Sok + Grzyb → Bo","Bo + Morwa → Mong"], f:"20× Mong + 10× Butelka → 10× Rosa"},
  {n:"Żółta", d:"szybkość", s:["Gango → Sok","Sok + Grzyb → Young","Young + Morwa → Hwal"], f:"20× Hwal + 10× Butelka → 10× Rosa"},
];
const COLORS = ["#c8955a","#e8c24a","#4fd39b","#5bb8ef","#a98bef","#ef6a9b","#ef6a5b","#cfd8d5"];
const mapById = Object.fromEntries(MAPS.map(m => [m.id, m]));
// default respawn spots per map: number of metin spots, boss spot names
const SEED = {
  m1:{metin:13, boss:["boss"]}, m2:{metin:10, boss:["boss"]}, m3:{metin:2, boss:[]},
  dol:{metin:7, boss:["boss stały","boss lootny"]}, pus:{metin:13, boss:["boss"]},
  soh:{metin:5, boss:["boss stały","boss lootny"]}, pie:{metin:4, boss:["boss 1","boss 2"]},
  hwa:{metin:7, boss:["boss 1","boss 2"]}, cze:{metin:4, boss:["boss"]}, duc:{metin:4, boss:["boss"]}, wez:{metin:7, boss:[]}, kra:{metin:4, boss:[]},
};

/* ---------- storage (safe) ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem("mt_"+k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem("mt_"+k, JSON.stringify(v)); } catch {} },
};

/* ---------- state ---------- */
// spot: {id, map, name, kind, min, max, color, o, t:{c1:timestamp, c2:..}}
let spots = {};
let view = store.get("view", "maps");           // "maps" | "wiki"
let tab = store.get("tab", "m1");               // map id or "mine"
const showMine = () => settings.hidden.length > 0 && visibleMaps().length >= 2;
const saveTab = () => { store.set("tab", tab); store.set("view", view); };
let settings = Object.assign({sound:0, wake:false, hidden:[], zoom:1, volume:0.8, compact:false, tablet:false, voice:false}, store.get("settings", {}));
if (!(settings.volume >= 0 && settings.volume <= 1)) settings.volume = 0.8;
if (!(settings.zoom >= 0.6 && settings.zoom <= 1.5)) settings.zoom = 1;
const applyZoom = () => { document.documentElement.style.setProperty("--zoom", settings.zoom); document.documentElement.classList.toggle("compact", !!settings.compact); document.documentElement.classList.toggle("tablet", !!settings.tablet); if (typeof fitNames === "function" && document.querySelector(".spots")) fitNames(); };
applyZoom();
/* timer size set by dragging the handle on a resp card (scale 0.6–3, per device) */
let spotScale = +store.get("sw", 1); if (!(spotScale >= 0.6 && spotScale <= 3)) spotScale = 1;
const applyScale = () => document.documentElement.style.setProperty("--sw", spotScale);
applyScale();
document.addEventListener("pointerdown", e => {
  const g = e.target.closest("[data-grip]"); if (!g) return;
  e.preventDefault();
  const card = g.closest(".spot"), cells = card.querySelector(".cells");
  const x0 = e.clientX, s0 = spotScale, w0 = cells.getBoundingClientRect().width || 1;
  const z = +getComputedStyle(document.documentElement).getPropertyValue("--zoom") || 1;
  g.setPointerCapture(e.pointerId); g.classList.add("drag"); document.body.classList.add("sizing");
  const move = ev => {
    // the card is centred, so it grows on both sides: twice the pointer movement goes into the timers
    const w = w0 + 2 * (ev.clientX - x0) / z;
    spotScale = Math.min(3, Math.max(0.6, Math.round(s0 * w / w0 * 100) / 100)); applyScale();
  };
  const up = () => { g.removeEventListener("pointermove", move); g.classList.remove("drag"); document.body.classList.remove("sizing"); store.set("sw", spotScale); if (typeof fitNames === "function") fitNames(); };
  g.addEventListener("pointermove", move); g.addEventListener("pointerup", up, {once: true}); g.addEventListener("pointercancel", up, {once: true});
});
document.addEventListener("dblclick", e => { if (!e.target.closest("[data-grip]")) return; spotScale = 1; applyScale(); store.set("sw", 1); toast("Domyślny rozmiar timerów"); });
// channel count is set by the admin for everyone (database: config/channels); last known value is cached here
let channels = store.get("channels", 5);
if (!(channels >= 1 && channels <= 10)) channels = 5;
if (!Array.isArray(settings.hidden)) settings.hidden = [];
const isHidden = id => settings.hidden.includes(id);
const visibleMaps = () => MAPS.filter(m => !isHidden(m.id));
const CHS = () => Array.from({length: channels}, (_, i) => "c" + (i + 1));
let online = null;         // {db, room, es}
let clockOffset = 0;       // serverTime - localTime
const alerted = {};        // "id:c1" -> state key already beeped
const now = () => Date.now() + clockOffset;
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const clone = o => o == null ? null : JSON.parse(JSON.stringify(o));

// default timer = shortest respawn from MiniWiki minus one minute, so you are there before it spawns
const dmin = r => Math.max(1, r[0] - 1);
function seedMap(mapId, base = Date.now()){
  const m = mapById[mapId], sd = SEED[mapId], out = {};
  let i = 0;
  for (let n = 1; n <= sd.metin; n++, i++) { const id = uid(); out[id] = {id, map:m.id, name:`${m.name} ${n}`, kind:"metin", min:dmin(m.metin), max:m.metin[1], color:null, o:base + i, t:{}}; }
  for (const b of sd.boss) { const id = uid(); out[id] = {id, map:m.id, name:`${m.name} ${b}`, kind:"boss", min:dmin(m.boss), max:m.boss[1], color:null, o:base + i++, t:{}}; }
  return out;
}
function seedAll(){
  const t = Date.now(); let out = {};
  MAPS.forEach((m, k) => Object.assign(out, seedMap(m.id, t + k * 1000)));
  // a few running timers on the first map so the states are visible right away
  const first = Object.values(out).filter(s => s.map === "m1").sort((a, b) => a.o - b.o);
  if (first[0]) first[0].t = {c1: t - 13*60000, c2: t - 19*60000, c3: t - 27*60000, c4: t - 5*60000};
  if (first[1]) first[1].t = {c2: t - 22*60000, c5: t - 2*60000};
  for (const sp of first.slice(0, 2)) for (const c in sp.t) sp.t[c] = {a: sp.t[c], mn: sp.min, mx: sp.max};
  return out;
}

/* ---------- paths & changes ---------- */
function getPath(root, path){ let o = root; for (const p of path.split("/").filter(Boolean)) { if (o == null || typeof o !== "object") return null; o = o[p]; } return o === undefined ? null : o; }
function setPath(root, path, val){
  const parts = path.split("/").filter(Boolean);
  if (!parts.length) { for (const k of Object.keys(root)) delete root[k]; if (val && typeof val === "object") Object.assign(root, val); return; }
  let o = root;
  for (let i = 0; i < parts.length - 1; i++) { if (typeof o[parts[i]] !== "object" || !o[parts[i]]) { if (val === null) return; o[parts[i]] = {}; } o = o[parts[i]]; }
  const last = parts[parts.length - 1];
  if (val === null) delete o[last]; else o[last] = val;
}
// changes: {"spotId": obj|null, "spotId/t/c3": value|null, "spotId/name": "…"} — paths inside `spots`
function apply(changes){ for (const [p, v] of Object.entries(changes)) setPath(spots, p, clone(v)); }

/* ---------- shared undo/redo history ----------
   One history per room (or per device in private mode), so anyone can undo or redo what anyone did.
   Entry: {at, p: JSON string of {spotId: {b: {path: before}, a: {path: after}}}}. Stored as a string so
   paths with "/" and null values survive the database. Keys sort by time. */
let H = {hist:{}, redo:{}};
const HMAX = 10;                                  // kept short: the whole room is downloaded on every join
const parsed = new Map();
const parts = e => { if (!e || typeof e.p !== "string") return {}; let v = parsed.get(e.p); if (!v) { try { v = JSON.parse(e.p) || {}; } catch { v = {}; } parsed.set(e.p, v); } return v; };
// undo/redo only covers timer marks (kill / reset); renames, times, adding or removing respawns are not undoable
const isTimer = p => /^[^/]+\/t(\/|$)/.test(p);
function tparts(e){
  const out = {};

function logGame(g, winnerNick, stake = g.s){

  const old = sortedKeys(remoteRoot.glog || {}); for (const x of old.slice(0, Math.max(0, old.length + 1 - 30))) rc[`glog/${x}`] = null;

  let win = [], lose = [];

function startGame(type, players, stake, extra = {}, id = hkey()){

/* ---------- debts: who owes whom ----------
   rooms/<room>/debts/<nickA|nickB> = {a, b, v}: v > 0 means a owes b that much yang, v < 0 means b owes a.
   Every game with a stake in k / kk / kkk adds the losers' stakes to what they owe the winner(s);
   "Spłacone" sets a pair back to zero. People are identified by nick (the same nick on two devices is one person).
   dlog keeps the last entries for the history list. */
const nkey = n => String(n).trim().toLowerCase().replace(/[.#$\[\]\/|]/g, "_").slice(0, 20) || "_";
function parseStake(s){
  const m = /^\s*(\d+(?:[.,]\d+)?)\s*(k*)\s*$/i.exec(String(s || ""));
  if (!m) return 0;
  return parseFloat(m[1].replace(",", ".")) * Math.pow(1000, m[2].length);

function fmtYang(v){
  const a = Math.abs(v), f = (x, u) => (Math.round(x * 100) / 100).toString().replace(".", ",") + u;
  return a >= 1e9 ? f(v / 1e9, "kkk") : a >= 1e6 ? f(v / 1e6, "kk") : a >= 1e3 ? f(v / 1e3, "k") : f(v, "");
}
function debtChanges(gameName, pmap, winIds, loseIds, stake){
  const x = parseStake(stake); if (!x || !winIds.length || !loseIds.length) return {};
  const debts = clone(remoteRoot.debts || {}) || {}, out = {}, share = x / winIds.length;
  for (const l of loseIds) for (const w of winIds) {
    const ln = String(pmap[l] || "?"), wn = String(pmap[w] || "?"), kl = nkey(ln), kw = nkey(wn); if (kl === kw) continue;
    const [ka, kb] = [kl, kw].sort(), key = ka + "|" + kb;
    const d = debts[key] || {a: ka === kl ? ln : wn, b: kb === kl ? ln : wn, v: 0};
    d.v = Math.round(((+d.v || 0) + (ka === kl ? share : -share)) * 100) / 100;
    d[ka === kl ? "a" : "b"] = ln.slice(0, 20); d[ka === kw ? "a" : "b"] = wn.slice(0, 20);   // keep the latest spelling of the nick
    debts[key] = d; out["debts/" + key] = d;
  }
  const wn = winIds.map(w => pmap[w]).join(", "), ln = loseIds.map(l => pmap[l]).join(", ");
  const k = hkey(); out["dlog/" + k] = {s: `${gameName}: ${wn} ${winIds.length > 1 ? "wygrywają" : "wygrywa"} ${fmtYang(x * loseIds.length)} od ${ln}`.slice(0, 200), at: {".sv": "timestamp"}};
  const old = sortedKeys(remoteRoot.dlog || {}); for (const o of old.slice(0, Math.max(0, old.length + 1 - 40))) out["dlog/" + o] = null;
  return out;
}
function debtsSheet(){
  if (!online) { toast("Rozliczenia działają we wspólnym pokoju. Połącz się w Menu."); return; }
  sheet(`<h2>Rozliczenia</h2><p>Kto komu ile wisi z gier na stawki (liczą się stawki w k, kk, kkk). Wygrane i przegrane między dwiema osobami się znoszą. Spłatę zaznacza osoba, której dług się należy.</p>
    <div class="dme" id="dl_me"></div>
    <div class="field"><label>Długi (kto → komu)</label><ul class="banlist" id="dl_list"></ul></div>
    <div class="field"><label>Ostatnie wpisy</label><ul class="banlist dlog" id="dl_log"></ul></div>
    <div class="acts"><button class="btn" data-close>Zamknij</button></div>`, el => {
    const draw = () => {
      const pairs = Object.entries(remoteRoot.debts || {}).map(([k, d]) => ({k, ...d, v: +d.v || 0})).filter(d => Math.abs(d.v) >= 0.005);
      const rows = pairs.map(d => d.v > 0 ? {k: d.k, from: d.a, to: d.b, v: d.v} : {k: d.k, from: d.b, to: d.a, v: -d.v}).sort((a, b) => b.v - a.v);
      const me = nkey(myNick()); let bal = 0;
      for (const r of rows) { if (nkey(r.to) === me) bal += r.v; if (nkey(r.from) === me) bal -= r.v; }
      el.querySelector("#dl_me").innerHTML = myNick() ? `Twój bilans: <b class="${bal > 0 ? "pos" : bal < 0 ? "neg" : ""}">${bal > 0 ? "+" : ""}${fmtYang(bal)}</b>${bal > 0 ? " (inni wiszą tobie)" : bal < 0 ? " (wisisz innym)" : ""}` : "";
      el.querySelector("#dl_list").innerHTML = rows.length ? rows.map(r => `<li><span><b>${esc(r.from)}</b> → <b>${esc(r.to)}</b> <b class="neg">${fmtYang(r.v)}</b></span>${nkey(r.to) === me ? `<button class="btn" data-paid="${esc(r.k)}">Spłacone</button>` : ""}</li>`).join("") : '<li class="pme">Nikt nikomu nic nie wisi.</li>';
      const log = Object.values(remoteRoot.dlog || {}).sort((a, b) => b.at - a.at).slice(0, 15);
      el.querySelector("#dl_log").innerHTML = log.length ? log.map(x => `<li><span>${esc(x.s)}</span><span class="pme">${new Date(x.at).toLocaleString("pl-PL", {day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"})}</span></li>`).join("") : '<li class="pme">Brak wpisów.</li>';
    };
    draw(); const iv = setInterval(() => { if (!el.isConnected) return clearInterval(iv); draw(); }, 2000);
    el.addEventListener("click", e => {
      const b = e.target.closest("[data-paid]"); if (!b) return;
      const k = b.dataset.paid, d = (remoteRoot.debts || {})[k]; if (!d) return;
      const from = d.v > 0 ? d.a : d.b, to = d.v > 0 ? d.b : d.a, v = Math.abs(+d.v || 0);
      if (nkey(to) !== nkey(myNick())) { toast("Spłatę może zaznaczyć tylko osoba, której należą się pieniądze."); return; }
      if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Na pewno?"; b.classList.add("danger"); setTimeout(() => { if (b.isConnected) { b.dataset.sure = ""; b.textContent = "Spłacone"; b.classList.remove("danger"); } }, 3000); return; }
      const hk = hkey(), rc = {["debts/" + k]: null, ["dlog/" + hk]: {s: `Spłacone: ${from} → ${to} ${fmtYang(v)}`.slice(0, 200), at: {".sv": "timestamp"}}};
      for (const [p, val] of Object.entries(rc)) setPath(remoteRoot, p, clone(svNow(val)));
      push(rc); draw(); toast("Zapisano spłatę");

/* dice: every player rolls their own two dice (game/rolls/<round>/<id> = [a, b]); round 0 is everyone,
   a tie sends the tied players to the next round (game/lv/<round>), up to 8 rounds */
const diceLeft = (g, r) => r === 0 && !(g.lv && g.lv[0]) ? Object.keys(g.p || {}) : Object.keys((g.lv && g.lv[r]) || {});
const diceRoll = (g, r) => (g.rolls && g.rolls[r]) || {};
const dsum = d => (+d[0] || 0) + (+d[1] || 0);

/* work that must happen even with the game window closed: the starter settles results, players open their RPS choice */
let settling = null;
async function gameTick(){
  const g = G(); if (!online || !g || !g.id || !(amIn(g) || g.by === deviceId || g.state === "ready")) return;
  const ps = gPlayers(g), host = g.by === deviceId;
  if (!host) poolHandover(g);
  dropAbsent(g);
  readyTick(g);
  if (g.type === "horse" && host) horseTick(g);
  if (g.type === "wheel" && host) wheelTick(g);
  if (g.type === "dice" && g.state === "play" && host) {
    const r = +g.rd || 0, left = diceLeft(g, r), rolled = diceRoll(g, r);
    if (left.length && left.every(id => rolled[id])) {
      const best = Math.max(...left.map(id => dsum(rolled[id]))), tied = left.filter(id => dsum(rolled[id]) === best);
      if (tied.length === 1) gamePatch({"game/w": tied[0], "game/state": "done"});
      else if (r >= 7) gamePatch({"game/w": tied[randInt(tied.length)], "game/state": "done"});
      else gamePatch({"game/rd": r + 1, [`game/lv/${r + 1}`]: Object.fromEntries(tied.map(id => [id, true]))});
    }
  }
  if (g.type === "reflex" && g.state === "play" && host) {
    const r = g.r || {}, all = ps.every(p => r[p.id] !== undefined);
    if (all || now() > (+g.go || 0) + 5000) {
      const ok = ps.filter(p => r[p.id] >= 0).sort((a, b) => r[a.id] - r[b.id]);
      const w = ok.length ? ok[0].id : ps[randInt(ps.length)].id;     // everyone false-started: random winner
      gamePatch({"game/w": w, "game/state": "done"});
    }
  }
  if (g.type === "guess" && g.state === "play" && host && secrets[g.id]) {
    const gs = g.g || {};
    if (ps.every(p => gs[p.id] !== undefined)) settleGuess(g);
  }
  if (g.type === "rps" && g.state === "play") {
    const [a, b] = rpsPair(g), c = g.c || {}, rv = g.rv || {}, sec = secrets[g.id + ":" + (g.round || 0)];
    if (c[a] && c[b] && sec && !rv[deviceId]) gamePatch({[`game/rv/${deviceId}`]: {ch: sec.ch, salt: sec.salt}});
    if (host && rv[a] && rv[b] && settling !== g.id + (g.round || 0)) { settling = g.id + (g.round || 0); rpsSettle(g); }
  }
  if (g.type !== "horse" && g.state === "done" && host && !g.logged && g.w && g.w !== "draw") logGame(g, nickOf(g, g.w));
}
setInterval(gameTick, 1000);
const rpsPair = g => [g.by, Object.keys(g.p || {}).find(id => id !== g.by)];
function settleGuess(g){
  const ps = gPlayers(g), gs = g.g || {}, t = secrets[g.id].t;
  const in_ = ps.filter(p => gs[p.id] !== undefined); if (!in_.length) { gamePatch({"game/state": "cancel"}); return; }
  const best = Math.min(...in_.map(p => Math.abs(gs[p.id] - t))), tied = in_.filter(p => Math.abs(gs[p.id] - t) === best);
  gamePatch({"game/t": t, "game/w": tied[randInt(tied.length)].id, "game/state": "done"});
}

let GAME_VIEW_WAIT = null, GAME_VIEW_READY = null, GAME_AFTER_DICE = null;
let gameShown = null, gameTimer = null, reflexLocal = null;
function onGame(initial){
  const g = G();
  if (!g || !g.id) { closeGame(); return; }
  const age = now() - (+g.at || now());
  if (initial && (g.state === "done" || g.state === "declined" || age > 10 * 60000)) { gameShown = g.id + ":seen"; return; }
  renderGame(); gameTick();
}
function closeGame(){ const el = document.getElementById("gamewin"); if (el) el.remove(); clearTimeout(gameTimer); }

}

    closeGame();
    el = document.createElement("div"); el.id = "gamewin"; el.className = "gfloat gamebox" + (g.type === "horse" ? " wide" : g.type === "wheel" ? " mid" : ""); el.dataset.gid = g.id;
    el.setAttribute("role", "dialog"); el.setAttribute("aria-label", GAMES[g.type].name);
    el.innerHTML = `<div class="ghead" data-drag><h2>${GAMES[g.type].name}</h2>${["wheel", "horse", "dice"].includes(g.type) ? `<button class="gx" data-gsnd aria-label="Dźwięk gry">${gameSnd ? "🔊" : "🔇"}</button>` : ""}${amIn(g) || g.type === "horse" || g.type === "wheel" ? "" : '<span class="pme">oglądasz</span>'}<button class="gx" data-gclose aria-label="Zamknij">✕</button></div><div class="gbody"></div>`;

  if (body.dataset.html !== html) {

    const keep = [...body.querySelectorAll("input[id]")].map(i => [i.id, i.value]), focus = document.activeElement && body.contains(document.activeElement) ? document.activeElement.id : null;
    const canvas = body.querySelector("canvas.htrack");

}
const stakeLine = g => `<p>${g.s ? `Stawka <b>${esc(g.s)}</b> · pula <b>${esc(poolText(g.s, Object.keys(g.p || {}).length))}</b> · ` : ""}gra ${esc(g.byn || "?")}</p>`;
const resLine = g => `<p class="spinres done">${g.type === "rps" && g.w === "draw" ? "Remis!" : `Wygrywa <b>${esc(nickOf(g, g.w))}</b>${g.w === deviceId ? " (ty!)" : ""}${g.s ? ` – zgarnia pulę <b>${esc(poolText(g.s, Object.keys(g.p || {}).length))}</b>` : ""}`}</p>`;

const GAME_VIEW = {
  dice(g){
    const ps = gPlayers(g), cur = +g.rd || 0, done = g.state === "done";
    const rows = [];

    }

  },

    if (mine !== undefined) return stakeLine(g) + `<p class="spinres">Twój czas: <b>${mine < 0 ? "falstart" : mine + " ms"}</b>. Czekam na resztę…</p>` + list;

  rps(g){

    <div class="field"><label for="hs_s">Stawka od osoby (opcjonalnie)</label><input id="hs_s" maxlength="30" autocomplete="off" placeholder="np. 10kk" value="${esc(store.get("rlStake", ""))}"></div>
    ${busy ? `<p style="color:var(--window)">${esc(busy)}</p>` : ""}
    <div class="acts"><button class="btn" data-close>Zamknij</button><button class="btn primary" id="hs_go"${busy ? " disabled" : ""}>Otwórz zakłady</button></div>
    <div class="field"><label>${wheel ? "Ostatnie losowania" : "Ostatnie wyścigi"}</label><ul class="banlist" id="gm_h"></ul></div>`, (el, close) => {
    const h = Object.values(remoteRoot.glog || {}).filter(x => x.type === type).sort((a, b) => b.at - a.at).slice(0, 5);
    el.querySelector("#gm_h").innerHTML = h.length ? h.map(x => `<li><span><b>${esc(x.w)}</b>${x.s ? ` <span class="pme">· pula ${esc(x.s)}</span>` : ""}</span><span class="pme">${new Date(x.at).toLocaleTimeString("pl-PL", {hour: "2-digit", minute: "2-digit"})}</span></li>`).join("") : '<li class="pme">Jeszcze nie było wyścigu.</li>';
    el.querySelector("#hs_go").onclick = () => { if (roomBusy()) { toast(roomBusy()); return; } const st = el.querySelector("#hs_s").value.trim(); if (st) store.set("rlStake", st); close(); hPick = null; startGame(type, [], st, {...(type === "horse" ? {lanes: shuffleLanes()} : {}), state: "bet"}); };
  });
}
/* rematch: the same people play the same game again (same stake, same sides, horse bets copied) */
const canRematch = g => amIn(g) || ((g.type === "horse" || g.type === "wheel") && g.by === deviceId);
function rematch(g){
  const hereNow = presentSet(), ps = gPlayers(g).filter(p => hereNow.has(p.id)), stake = g.s || "";
  if (ps.length < 2) { toast("Do rewanżu potrzeba co najmniej dwóch graczy."); return; }
  if (roomBusy()) { toast(roomBusy()); return; }
  // whoever clicks Rewanż, the game stays with the person who started it (if they are still in the room)
  const owner = hereNow.has(g.by) && (!GAMES[g.type].duel || ps.some(p => p.id === g.by)) ? {by: g.by, byn: g.byn} : {};
  if (g.type !== "horse" && g.type !== "wheel") {
    // 10 s for everyone to leave (or, in group games, join) before the rematch starts by itself
    const extra = {state: "wait", ...owner};
    if (g.type === "coin") extra.oz = g.side === "orzel" ? g.by : ps.find(p => p.id !== g.by).id;   // who has "orzeł"
    startGame(g.type, ps, stake, extra);
  }
  else if (g.type === "horse" || g.type === "wheel") { hPick = null; startGame(g.type, ps, stake, {...owner, state: "bet", b: Object.fromEntries(Object.entries(g.b || {}).filter(([id]) => hereNow.has(id))), ...(g.type === "horse" ? {lanes: shuffleLanes()} : {})}); }
}
/* people who closed the page are dropped: absent players are not copied into a rematch, and while bets are open
   or a rematch is waiting, the person running the game removes anyone who is no longer in the room.
   The person running the game and a logged-in admin can also remove someone by hand (✕). */
const presentSet = () => new Set(people().map(p => p.id));
const here = id => presentSet().has(id);
const isAdmin = () => !!store.get("adminOk", false);
const canKick = g => g.by === deviceId || isAdmin();
const kickBtn = (g, id, act) => canKick(g) && id !== deviceId ? `<button class="kick" data-gact="${act}" data-id="${esc(id)}" title="Usuń z gry" aria-label="Usuń z gry">✕</button>` : "";
function dropAbsent(g){
  if (g.by !== deviceId || !(g.state === "bet" || g.state === "wait")) return;
  const hereNow = presentSet(); if (!hereNow.has(deviceId)) return;          // presence not loaded yet: do nothing
  const gone = new Set([...Object.keys(g.p || {}), ...Object.keys(g.b || {})].filter(id => !hereNow.has(id)));
  if (!gone.size) return;
  const rc = {}; for (const id of gone) { rc[`game/p/${id}`] = null; if (g.b && g.b[id]) rc[`game/b/${id}`] = null; }
  gamePatch(rc);
}
// the waiting room is over: whoever runs it (the starter, or the next player if the starter is gone) starts the game
function beginRematch(g, extra = {}){
  const ps = gPlayers(g), me = deviceId;
  if (ps.length < 2 || (GAMES[g.type].duel && !g.p[me])) { gamePatch({...extra, "game/state": "cancel"}); return; }
  const base = {...extra, "game/by": me, "game/byn": myNick().slice(0, 20), "game/at": {".sv": "timestamp"}, "game/logged": null};
  if (g.type === "dice") gamePatch({...base, "game/state": "play", "game/rd": 0});
  else if (g.type === "reflex") gamePatch({...base, "game/state": "play", "game/go": Math.round(now()) + 4000 + randInt(4000)});
  else if (g.type === "guess") { secrets[g.id] = {t: randInt(100) + 1}; store.set("gsec", secrets); gamePatch({...base, "game/state": "play"}); }
  else if (g.type === "rps") gamePatch({...base, "game/state": "play"});
  else if (g.type === "coin") {
    const other = ps.find(p => p.id !== me).id, side = g.oz === me ? "orzel" : "reszka", res = randInt(2) ? "orzel" : "reszka";
    gamePatch({...base, "game/state": "done", "game/side": side, "game/res": res, "game/w": res === side ? me : other, "game/ft": {".sv": "timestamp"}, "game/oz": null});
  }
}
GAME_VIEW_WAIT = g => {
  const ps = gPlayers(g), duel = GAMES[g.type].duel, own = g.by === deviceId;
  const btn = (amIn(g) ? `<button class="btn" data-gact="wout">Wypisz się</button>` : duel ? "" : `<button class="btn" data-gact="win">Dołącz</button>`)
    + (own ? `<button class="btn" data-gact="cancel">Odwołaj</button><button class="btn primary" data-gact="lstart"${ps.length < 2 ? " disabled" : ""}>Start</button>` : "");
  return stakeLine(g) + `<p>${own ? "Gdy wszyscy będą na miejscu, kliknij Start – gracze potwierdzą gotowość." : `Grę wystartuje ${esc(g.byn || "")}, potem potwierdzisz gotowość.`}${duel ? "" : " Można dołączyć albo się wypisać."}</p>`
    + ps.map(p => `<div class="gline"><span>${esc(p.n)}${p.id === deviceId ? ' <span class="pme">(ty)</span>' : ""}</span><b>${here(p.id) ? "gra" : '<span class="neg">nieaktywny</span>'}${kickBtn(g, p.id, "wkick")}</b></div>`).join("")
    + (btn ? `<div class="acts" style="justify-content:center">${btn}</div>` : "") + ownerLine(g);
};
async function rpsSettle(g){
  const [a, b] = rpsPair(g), rv = g.rv, c = g.c;
  const ok = async id => rv[id] && (await sha256(rv[id].ch + ":" + rv[id].salt)) === c[id];
  if (!(await ok(a)) || !(await ok(b))) { gamePatch({"game/state": "done", "game/w": "draw"}); return; }   // tampered: no winner
  const x = rv[a].ch, y = rv[b].ch, w = x === y ? "draw" : rpsBeats(x, y) ? a : b;
  gamePatch({"game/state": "done", "game/w": w});
}
async function gameClick(e){
  const g = G(), el = document.getElementById("gamewin");
  const sb = e.target.closest("[data-gsnd]");
  if (sb) { gameSnd = !gameSnd; store.set("gameSnd", gameSnd); sb.textContent = gameSnd ? "🔊" : "🔇"; if (gameSnd) audio(); return; }
  if (e.target.closest("[data-gclose]")) { gameShown = g ? g.id + ":seen" : null; closeGame(); return; }
  const b = e.target.closest("[data-gact]"); if (!b || !g) return;
  const act = b.dataset.gact;
  if (act === "rematch") { if (canRematch(g) && g.state === "done") rematch(g); return; }
  if (g.state === "ready") {
    if (act === "rdy" && lobbyIds(g).includes(deviceId)) gamePatch({[`game/ok/${deviceId}`]: true});
    return;
  }
  if (g.type === "horse" || g.type === "wheel") { horseClick(g, act, b); return; }
  if (g.state === "wait") {
    if (act === "lstart" && g.by === deviceId) readyStart(g);
    if (act === "cancel" && g.by === deviceId) gamePatch({"game/state": "cancel"});
    if (act === "wout" && amIn(g)) gamePatch({[`game/p/${deviceId}`]: null});
    if (act === "wkick" && canKick(g)) gamePatch({[`game/p/${b.dataset.id}`]: null});
    if (act === "win" && !amIn(g) && !GAMES[g.type].duel && myNick()) gamePatch({[`game/p/${deviceId}`]: myNick().slice(0, 20)});
    return;
  }
  if (!amIn(g)) return;
  if (act === "accept" && g.type === "coin") {
    const res = randInt(2) ? "orzel" : "reszka", w = res === g.side ? g.by : deviceId;
    gamePatch({"game/state": "done", "game/res": res, "game/w": w, "game/ft": {".sv": "timestamp"}});
  } else if (act === "accept") gamePatch({"game/state": "play"});
  else if (act === "decline") gamePatch({"game/state": "declined"});
  else if (act === "cancel") gamePatch({"game/state": "cancel"});
  else if (act === "roll") {
    const r = +g.rd || 0;
    if (!diceLeft(g, r).includes(deviceId) || diceRoll(g, r)[deviceId]) return;
    gamePatch({[`game/rolls/${r}/${deviceId}`]: [randInt(6) + 1, randInt(6) + 1]});
  } else if (act === "dskip") {
    const r = +g.rd || 0, rolled = diceRoll(g, r);
    gamePatch({[`game/lv/${r}`]: Object.fromEntries(Object.keys(rolled).map(id => [id, true]))});
  }
  else if (act === "tap") {
    if (g.r && g.r[deviceId] !== undefined) return;
    const go = +g.go || 0, early = now() < go || !reflexLocal || reflexLocal.id !== g.id;
    const ms = early ? -1 : Math.max(0, Math.round(performance.now() - reflexLocal.green));
    gamePatch({[`game/r/${deviceId}`]: ms});
  } else if (act === "guess") {
    const n = Math.round(+document.getElementById("g_num").value);
    if (!(n >= 1 && n <= 100)) { toast("Wpisz liczbę od 1 do 100."); return; }
    gamePatch({[`game/g/${deviceId}`]: n});
  } else if (act === "reveal") {
    if (secrets[g.id]) settleGuess(g);
  } else if (act === "rps") {
    if (g.c && g.c[deviceId]) return;
    const ch = b.dataset.ch, salt = uid() + uid();
    secrets[g.id + ":" + (g.round || 0)] = {ch, salt}; store.set("gsec", secrets);
    gamePatch({[`game/c/${deviceId}`]: await sha256(ch + ":" + salt)});
  } else if (act === "again") gamePatch({"game/state": "play", "game/c": null, "game/rv": null, "game/w": null, "game/round": (g.round || 0) + 1});
}

function gamesMenu(){
  sheet(`<h2>Gry</h2>${online ? "<p>Gry dla osób w twoim pokoju. Grający widzą okno gry, pozostali tylko krótki dymek z wynikiem.</p>" : "<p>Gry działają we wspólnym pokoju. Połącz się w Menu → Wspólny pokój.</p>"}
    <button class="btn primary dbtn" data-game="debts">Rozliczenia – kto komu ile wisi</button>
    <div class="gamelist"><button class="btn" data-game="roul">Loteria</button><button class="btn" data-game="dice">Kości</button><button class="btn" data-game="coin">Rzut monetą</button><button class="btn" data-game="reflex">Refleks</button><button class="btn" data-game="guess">Zgadnij liczbę</button><button class="btn" data-game="rps">Kamień, papier, nożyce</button><button class="btn" data-game="horse">Wyścig konny</button><button class="btn" data-game="wheel">Ruletka</button></div>
    <div class="acts"><button class="btn" data-close>Zamknij</button></div>`, (el, close) => {
    el.querySelectorAll("[data-game]").forEach(b => b.onclick = () => { close(); b.dataset.game === "roul" ? rouletteSheet() : b.dataset.game === "debts" ? debtsSheet() : gameSheet(b.dataset.game); });
  });
}
function gameSheet(type){
  if (!online) { toast("Gry działają we wspólnym pokoju. Połącz się w Menu."); return; }
  if (type === "horse" || type === "wheel") return horseSheet(type);
  const def = GAMES[type];
  const busy = roomBusy();
  sheet(`<h2>${def.name}</h2>
    <p>${{dice: "Każdy gracz sam klika swój rzut dwiema kośćmi. Najwyższa suma wygrywa całą pulę, przy remisie jest dogrywka.",
          coin: "Wyzwij jedną osobę. Wybierasz orła albo reszkę, przeciwnik dostaje drugą stronę.",
          reflex: "Ekran wszystkich graczy w tej samej chwili zrobi się zielony. Wygrywa najszybsze stuknięcie.",
          guess: "Losuje się liczba od 1 do 100. Każdy typuje, wygrywa najbliższy.",
          rps: "Wyzwij jedną osobę. Oboje wybieracie w ukryciu, wynik pokazuje się jednocześnie."}[type]}</p>
    ${busy ? `<p style="color:var(--window)">${esc(busy)}</p>` : ""}
    <div class="field"><label for="gm_s">Stawka od osoby (opcjonalnie)</label><input id="gm_s" maxlength="30" autocomplete="off" placeholder="np. 10kk" value="${esc(store.get("rlStake", ""))}"></div>
    ${type === "coin" ? `<div class="field"><label>Twoja strona</label><div class="seg"><button data-side="orzel" aria-pressed="true">Orzeł</button><button data-side="reszka" aria-pressed="false">Reszka</button></div></div>` : ""}
    <div class="field"><label>${def.duel ? "Przeciwnik" : "Gracze"}</label><ul class="banlist" id="gm_p"></ul></div>
    <p id="gm_err" style="color:var(--danger)" hidden></p>
    <div class="acts"><button class="btn" data-close>Zamknij</button><button class="btn primary" id="gm_go"${busy ? " disabled" : ""}>${def.duel ? "Wyzwij" : "Start"}</button></div>
    <div class="field"><label>Ostatnie wyniki</label><ul class="banlist" id="gm_h"></ul></div>`, (el, close) => {
    const skip = new Set(); let opp = null, side = "orzel";
    const draw = () => {
      const ps = people();
      el.querySelector("#gm_p").innerHTML = (def.duel ? ps.filter(p => !p.me) : ps).map(p => def.duel
        ? `<li><label class="rlp"><span>${esc(p.n)}</span><input type="radio" name="gm_opp" data-op="${esc(p.id)}" ${opp === p.id ? "checked" : ""} aria-label="${esc(p.n)}"></label></li>`
        : `<li><label class="rlp"><span>${esc(p.n)}${p.me ? ' <span class="pme">(ty)</span>' : ""}</span><input type="checkbox" data-rp="${esc(p.id)}" ${skip.has(p.id) ? "" : "checked"} aria-label="${esc(p.n)} gra"></label></li>`).join("")
        || `<li class="pme">${def.duel ? "Nie ma nikogo do wyzwania." : "Nikogo nie ma w pokoju."}</li>`;
      const h = Object.values(remoteRoot.glog || {}).filter(x => x.type === type).sort((a, b) => b.at - a.at).slice(0, 5);
      el.querySelector("#gm_h").innerHTML = h.length ? h.map(x => `<li><span><b>${esc(x.w)}</b>${x.s ? ` <span class="pme">· pula ${esc(poolText(x.s, x.n))}</span>` : ""} <span class="pme">· ${x.n} graczy</span></span><span class="pme">${new Date(x.at).toLocaleTimeString("pl-PL", {hour: "2-digit", minute: "2-digit"})}</span></li>`).join("") : '<li class="pme">Jeszcze nikt nie grał.</li>';
    };
    draw(); const iv = setInterval(() => { if (!el.isConnected) return clearInterval(iv); if (document.activeElement && document.activeElement.id === "gm_s") return; draw(); }, 3000);
    el.addEventListener("change", e => {
      const c = e.target.closest("[data-rp]"); if (c) c.checked ? skip.delete(c.dataset.rp) : skip.add(c.dataset.rp);
      const o = e.target.closest("[data-op]"); if (o) opp = o.dataset.op;
    });
    el.querySelectorAll("[data-side]").forEach(b => b.onclick = () => { side = b.dataset.side; el.querySelectorAll("[data-side]").forEach(x => x.setAttribute("aria-pressed", x === b)); });
    el.querySelector("#gm_go").onclick = () => {
      if (roomBusy()) { toast(roomBusy()); return; }
      const err = el.querySelector("#gm_err"), stake = el.querySelector("#gm_s").value.trim(); err.hidden = true;
      if (stake) store.set("rlStake", stake);
      const all = people();
      if (def.duel) {
        const o = all.find(p => p.id === opp); if (!o) { err.textContent = "Wybierz przeciwnika."; err.hidden = false; return; }
        const me = all.find(p => p.me) || {id: deviceId, n: myNick()};
        close(); startGame(type, [me, o], stake, type === "coin" ? {state: "invite", side} : {state: "invite"}); return;
      }
      const ps = all.filter(p => !skip.has(p.id));
      if (ps.length < def.min) { err.textContent = "Do gry potrzeba co najmniej dwóch osób."; err.hidden = false; return; }
      close();
      startGame(type, ps, stake, {state: "wait"});          // lobby: the owner starts, everyone confirms they are ready
    };
  });
}

/* ---------- boot ---------- */
const saved = store.get("spots", null);
spots = saved && typeof saved === "object" ? saved : seedAll();
for (const s of Object.values(spots)) if (!s.t || typeof s.t !== "object") s.t = {};
if (saved && !store.get("noColorsV1", false)) { for (const s of Object.values(spots)) s.color = null; store.set("spots", spots); }
if (!store.get("noColorsV1", false)) { settings.sound = 0; store.set("settings", settings); }
store.set("noColorsV1", true);
if (!saved) store.set("spots", spots);
updateReset(); render(); setInterval(tick, 250); wake();
loadConfig(); setInterval(loadConfig, 60000);
document.getElementById("roomSel").addEventListener("change", e => switchRoom(e.target.value));
document.getElementById("people").addEventListener("click", e => { e.stopPropagation(); e.currentTarget.classList.toggle("open"); });
document.addEventListener("click", () => document.getElementById("people").classList.remove("open"));
renderRoomSel();
// inside the app: tell once per new version that an update is available
if (IN_APP) setTimeout(async () => {
  const rel = await latestRelease();
  if (rel && verNum(rel.v) > verNum(APP_VER || "1.0") && store.get("updNotice", "") !== rel.v) {
    store.set("updNotice", rel.v); toast(`Jest nowa wersja aplikacji ${rel.v}. Pobierzesz ją w Menu.`);
  }
}, 3000);
const auto = store.get("online", null);
// rooms connect only after the site password was entered
afterUnlock.push(() => {
  if (!(auto && auto.room) || online) return;
  // nick is required in rooms: ask for it once if this device joined before nicks existed
  if (!myNick()) { store.set("online", null); setTimeout(() => { menuSheet(); toast("Wpisz swój nick, żeby wrócić do pokoju " + auto.room); }, 300); return; }
  connect(DB_URL, auto.room).catch(() => setMode("Prywatny"));
});
gate();
})();
