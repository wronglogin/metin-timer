<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1417">
<title>Metin Timer</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Metin Timer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@500;700;900&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: sticky top bar + scrollable map tabs; each map shows its respawn spots as rows, channels CH1–CH5/6 left to right. Dark only — a night-time game tool. */
:root{
  --bg:#0f1417; --surface:#182026; --surface-2:#202a31; --rule:#2b3740;
  --fg:#e7ece9; --muted:#8c9b98; --accent:#c8955a; --accent-ink:#1b130a;
  --wait:#9fb4c4; --window:#e8c24a; --ready:#4fd39b; --over:#4ea3e8; --danger:#ef6a5b;
  --f-ui:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-num:"Chivo Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-ui);font-size:17px;line-height:1.35;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 0;display:grid;gap:8px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;margin-right:auto}
@media (max-width:520px){.brand{flex-basis:100%}}
.radio{display:flex;align-items:center;gap:2px;min-width:170px;flex:1 1 220px;max-width:340px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:3px}
.radio .rbtn{display:grid;place-items:center;width:32px;height:32px;flex:0 0 auto;background:none;border:0;border-radius:6px;color:var(--fg)}
.radio .rbtn:hover{background:var(--surface-2)}
.radio .rtitle{flex:1;min-width:0;overflow:hidden;white-space:nowrap;font-size:14px;color:var(--fg);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.radio .rtitle span{display:inline-block;padding-left:2px}
.radio.off .rtitle{color:var(--muted)}
.radio.off [data-radio="on"]{color:var(--ready)}
@media (prefers-reduced-motion:no-preference){.radio:not(.off) .rtitle span{animation:marq 14s linear infinite}}
@keyframes marq{0%,15%{transform:translateX(0)}85%,100%{transform:translateX(min(0px,calc(-100% + 160px)))}}
.ytdock{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:12;width:200px;height:200px;border-radius:8px;overflow:hidden;border:1px solid var(--rule);box-shadow:0 8px 24px rgba(0,0,0,.45);background:#000}
.ytdock iframe{width:200px;height:200px;display:block}
.rq li{padding:4px 4px 4px 6px}
.rq li.rnow{border-color:var(--accent)}
.rqplay{flex:1;min-width:0;text-align:left;background:none;border:0;padding:4px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rq .btn{min-height:30px;padding:2px 9px}
@media (max-width:520px){.radio{flex:1 1 100%;max-width:none}}
.brand small{display:block;font-size:12px;font-weight:500;letter-spacing:.12em;color:var(--muted)}
.people{position:relative;display:inline-flex;align-items:center;gap:5px;min-height:38px;padding:0 10px;border:1px solid var(--rule);border-radius:6px;background:var(--surface-2);color:var(--ready);font-family:var(--f-num);font-weight:700;cursor:default}
.people .plist{display:none;position:absolute;top:calc(100% + 6px);right:0;z-index:15;min-width:170px;max-height:60vh;overflow:auto;margin:0;padding:8px 0;list-style:none;background:var(--surface);border:1px solid var(--rule);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.4);font-family:var(--f-ui);font-weight:600;color:var(--fg)}
.people .plist li{padding:5px 14px;white-space:nowrap}
.people .pme{color:var(--muted);font-weight:500}
.banlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.banlist li{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:6px 6px 6px 12px;font-weight:600}
.banlist .btn{min-height:32px;padding:4px 10px}
.banlist .pme{color:var(--muted);font-weight:500;font-size:14px}
.banlist li.pme{background:none;border:0;padding:0}
.people:hover .plist,.people:focus-within .plist,.people.open .plist{display:block}
.roomsel.on{border-color:var(--ready);color:var(--ready)}
.roomsel{background:var(--surface-2);border:1px solid var(--rule);border-radius:6px;min-height:38px;padding:4px 8px;max-width:150px}
.mode{font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--rule);border-radius:4px;color:var(--muted)}
.mode.on{color:var(--ready);border-color:var(--ready)}
.mode.err{color:var(--danger);border-color:var(--danger)}
.btn{background:var(--surface-2);border:1px solid var(--rule);border-radius:6px;padding:6px 12px;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
#wikiBtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--rule))}
.icon{min-width:42px;padding:6px 8px;font-weight:700}

.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;border-bottom:1px solid var(--rule);padding-bottom:0}
.tab{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:8px 10px 6px;color:var(--muted);font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab.mine{color:var(--accent)}
.tab.mine[aria-selected="true"]{color:var(--fg)}
.tab.mine::after{content:"";width:1px;height:18px;background:var(--rule);margin-left:8px}
.badge{font-family:var(--f-num);font-size:12px;border-radius:9px;padding:0 6px;background:var(--surface-2);color:var(--muted)}
.badge.ready{background:var(--over);color:#04192b}

main{padding-top:14px;display:grid;gap:14px}
.maphead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.maphead h1{font-size:26px;margin:0;letter-spacing:.02em;text-wrap:balance}
.ranges{font-family:var(--f-num);font-size:13px;color:var(--muted)}
.spots{display:grid;gap:8px;zoom:var(--zoom,1)}
.zoomrow{display:flex;align-items:center;gap:10px}
.zoomrow input[type=range]{flex:1;accent-color:var(--accent);min-height:32px}
.zoomrow output{font-family:var(--f-num);font-size:14px;min-width:44px;text-align:right}
.spot{display:grid;gap:10px;background:var(--surface);border:1px solid var(--rule);border-left:5px solid var(--c,var(--rule));border-radius:8px;padding:10px 12px}
/* a coloured resp also gets a top bar and a faint tint behind its name, so neighbours are easy to tell apart */
.spot.colored{border-top:4px solid var(--c);border-color:color-mix(in srgb,var(--c) 45%,var(--rule));border-left-color:var(--c);border-top-color:var(--c);background:linear-gradient(to bottom,color-mix(in srgb,var(--c) 16%,var(--surface)),var(--surface) 64px)}
@container pane (min-width:700px){.spot{grid-template-columns:minmax(200px,250px) minmax(0,1fr);align-items:center;gap:14px}}
.panes{display:grid;gap:26px}
.pane{container:pane / inline-size;display:grid;gap:12px;min-width:0}
.mineview .pane+.pane{border-top:1px solid var(--rule);padding-top:16px}
.mineview .maphead h1{font-size:22px}

.shead{display:grid;gap:6px;min-width:0}
.shead .nm{background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 6px;margin:-4px -6px;font-weight:700;font-size:19px;width:calc(100% + 12px);min-width:0}
.shead .nm:hover{border-color:var(--rule)}
.shead .nm:focus{border-color:var(--accent);background:var(--bg);outline:none}
.srow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--rule);border-radius:4px;padding:1px 6px}
.tag.boss{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,var(--rule))}
.srow input{width:52px;background:var(--bg);border:1px solid var(--rule);border-radius:5px;padding:3px 6px;font-family:var(--f-num);font-size:14px;text-align:center}
@media (max-width:420px){
  .bar{gap:6px}.btn{padding:6px 9px}.icon{min-width:34px;padding:6px 4px}.mode{font-size:11px;padding:3px 6px}
  .srow{gap:4px}.srow input{width:40px;padding:3px 2px}.srow .mini{min-width:28px;padding:0 4px}.srow .more{padding:2px 7px}.tag{padding:1px 4px}
  .ranges{font-size:12px}
}
.srow .sur{margin-left:auto;display:flex;gap:4px}
.srow .mini{background:none;border:1px solid var(--rule);border-radius:5px;color:var(--muted);min-height:30px;min-width:34px;padding:0 6px;font-weight:700}
.srow .mini:hover:not(:disabled){color:var(--fg);border-color:var(--muted)}
.srow .mini:disabled{opacity:.3;cursor:default}
.srow .more{background:none;border:1px solid var(--rule);border-radius:5px;padding:2px 10px;color:var(--muted);min-height:30px}
.srow .more:hover{color:var(--fg);border-color:var(--muted)}
.cells{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,64px));gap:clamp(3px,1.2cqi,6px);container-type:inline-size}
.cell{display:grid;gap:4px;min-width:0}
.cell .ch{font-size:clamp(10px,calc(14cqi / var(--cols)),12px);letter-spacing:.08em;text-align:center;color:var(--muted)}
.cell .ct{border:1px solid var(--rule);border-radius:6px;aspect-ratio:1/1;width:100%;padding:0 1px;letter-spacing:-.04em;background:var(--surface-2);color:var(--muted);font-family:var(--f-num);font-weight:900;font-size:clamp(11px,calc(24cqi / var(--cols)),18px);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.cell .ct:hover{border-color:var(--muted)}
.cell.idle .ct{background:var(--ready);color:#06210f;border-color:var(--ready)}
.cell.wait .ct{background:var(--danger);color:#2a0905;border-color:var(--danger)}
.cell.window .ct{background:var(--window);color:#241a00;border-color:var(--window)}
.cell.ready .ct{background:var(--over);color:#04192b;border-color:var(--over)}
.cell .rs{background:none;border:1px solid var(--rule);border-radius:5px;color:var(--muted);font-size:clamp(9px,calc(13cqi / var(--cols)),11px);letter-spacing:.08em;text-transform:uppercase;min-height:26px;padding:0}
.cell .rs:hover:not(:disabled){color:var(--fg);border-color:var(--muted)}
.cell .rs:disabled{opacity:.3;cursor:default}
.empty{border:1px dashed var(--rule);border-radius:8px;padding:18px;color:var(--muted);display:grid;gap:10px;justify-items:start}
.addrow{display:flex;flex-wrap:wrap;gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend b{font-weight:600}
.legend .w{color:var(--danger)} .legend .y{color:var(--window)} .legend .g{color:var(--ready)} .legend .b{color:var(--over)}

/* compact view: only name, undo/redo and channel timers */
.compact .tag,.compact .srow .more,.compact .cell .rs,.compact .ranges,.compact .legend,.compact .addrow{display:none}
.compact main{padding-top:8px;gap:8px}
.compact .maphead h1{font-size:18px}
.compact .spots{gap:5px}
.compact .spot{padding:6px 8px;gap:5px}
.compact .shead{display:flex;align-items:center;gap:6px}
.compact .shead .nm{font-size:15px;margin:0;padding:0 2px;width:auto;flex:1;pointer-events:none;border:0;background:none}
.compact .srow{flex-wrap:nowrap}
.compact .mintime{font-size:13px;color:var(--muted);white-space:nowrap}
.compact .mintime input{width:38px;padding:1px 2px;font-size:13px}
.compact .srow .mini{min-height:26px;min-width:28px;padding:0 4px}
.compact .cell{gap:2px}
.compact .cells{grid-template-columns:repeat(var(--cols),minmax(0,56px))}
.compact .cell .ct{font-size:clamp(10px,calc(21cqi / var(--cols)),15.5px)}
/* long values like -160:09 step down a size so they still fit the square */
.cell .ct.mid{font-size:clamp(10px,calc(21cqi / var(--cols)),16px);letter-spacing:-.05em}
.compact .cell .ct.mid{font-size:clamp(9px,calc(19cqi / var(--cols)),14px)}
.cell .ct.long{font-size:clamp(10px,calc(19cqi / var(--cols)),14.5px);letter-spacing:-.06em}
.compact .cell .ct.long{font-size:clamp(9px,calc(17cqi / var(--cols)),12.5px)}
.compact .cell .ch{font-size:10px}
.compact .mineview .pane+.pane{padding-top:8px}
@container pane (min-width:520px){.compact .spot{grid-template-columns:max(var(--namew,150px),66px) minmax(0,1fr);align-items:center;gap:8px}.compact .shead{flex-wrap:wrap;gap:2px 6px}.compact .shead .nm{flex-basis:100%}}
/* site password screen */
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.gatebox{display:grid;gap:10px;width:min(340px,100%);text-align:center}
.gatebox h1{margin:0;font-size:30px;letter-spacing:.06em;text-transform:uppercase}
.gatebox p{margin:0;color:var(--muted)}
.gatebox input{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;font-size:18px;text-align:center}
.gatebox .gerr{color:var(--danger)}
/* wiki */
.wiki{display:grid;gap:18px}
.wiki h2{font-size:20px;margin:0 0 6px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.wmaps{display:grid;gap:6px}
.wmap{background:var(--surface);border:1px solid var(--rule);border-radius:8px}
.wmap[open]{border-color:color-mix(in srgb,var(--accent) 45%,var(--rule))}
.wmap summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 14px;font-weight:700;font-size:18px}
.wmap summary::-webkit-details-marker{display:none}
.wmap summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.wmap[open] summary::after{transform:rotate(-135deg)}
.wmap summary .sub{font-weight:500;font-size:14px;color:var(--muted)}
.wbody{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;padding:0 14px 14px}
.wcol{background:var(--surface-2);border-radius:6px;padding:10px 12px;display:grid;gap:6px}
.wcol h3{margin:0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.wrow{display:flex;justify-content:space-between;gap:12px;font-size:16px}
.wrow span:first-child{color:var(--muted)}
.wrow span:last-child{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.wnote{color:var(--muted);font-size:14px;margin:8px 0 0}
.rosy{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.rosa{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
.rosa h3{margin:0 0 4px;font-size:17px}
.rosa ol{margin:0;padding-left:20px;font-size:15px}
.rosa p{margin:6px 0 0;font-size:14px;color:var(--muted)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border:1px solid var(--rule);border-radius:12px 12px 0 0;width:min(560px,100%);max-height:88vh;overflow:auto;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:12px}}
.sheet h2{margin:0;font-size:22px}
.sheet p{margin:0;color:var(--muted);font-size:15px}
.field{display:grid;gap:4px}
.field label{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;min-height:40px;width:100%}
.field textarea{font-family:var(--f-num);font-size:12px;min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--rule);background:var(--c)}
.sw.none{background:linear-gradient(135deg,transparent 45%,var(--muted) 45%,var(--muted) 55%,transparent 55%),var(--bg)}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--bg) inset}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.acts .grow{margin-right:auto}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:6px 12px;min-height:38px}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--rule);border-radius:8px;padding:8px 14px;z-index:30;font-size:15px;max-width:90vw}
@media (prefers-reduced-motion:no-preference){.cell.window .ct{animation:pulse 1.6s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.75}}
/* tablet view (Menu → Widok → Tabletowy): resp cards in several columns, using the full width */
.tablet .wrap{max-width:1700px}
.tablet .spots{grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));align-items:start}
.tablet .spots .spot{grid-template-columns:minmax(0,1fr);align-items:stretch;gap:10px}
.tablet.compact .spots{grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.tablet.compact .spots .spot{gap:5px}
.tablet.compact .spots .shead{flex-wrap:nowrap}
.tablet.compact .spots .shead .nm{flex-basis:auto}
@media (min-width:900px){.tablet .wiki{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
</style>

<div class="wrap">
  <header>
    <div class="bar">
      <div class="brand">Metin Timer<small>respawn metinów i bossów</small></div>
      <div id="radio" class="radio" hidden></div>
      <span class="mode" id="mode">Prywatny</span>
      <select id="roomSel" class="roomsel" aria-label="Pokój" hidden></select>
      <div id="people" class="people" hidden tabindex="0" role="button" aria-label="Osoby w pokoju"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="9" cy="8" r="3.2" fill="currentColor"/><path d="M2.5 19c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5z" fill="currentColor"/><circle cx="17" cy="9" r="2.5" fill="currentColor" opacity=".6"/><path d="M15.5 13.6c2.9-.3 5.4 1.4 6 4.4h-4.4c-.3-1.7-.8-3.1-1.6-4.4z" fill="currentColor" opacity=".6"/></svg><span class="pc">0</span><ul class="plist"></ul></div>
      <button class="btn icon" id="undo" title="Cofnij (Ctrl+Z)" aria-label="Cofnij">↶</button>
      <button class="btn icon" id="redo" title="Ponów (Ctrl+Y)" aria-label="Ponów">↷</button>
      <button class="btn" id="wikiBtn" aria-pressed="false">MiniWiki</button>
      <button class="btn" id="menuBtn">Menu</button>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </header>
  <main id="main"></main>
</div>
<div id="layer"></div>
<div id="ytdock" class="ytdock" hidden><div id="ytplayer"></div></div>

<script>
(() => {
"use strict";
/* ---------- data ---------- */

/* ---------- paths & changes ---------- */
function getPath(root, path){ let o = root; for (const p of path.split("/").filter(Boolean)) { if (o == null || typeof o !== "object") return null; o = o[p]; } return o === undefined ? null : o; }
function setPath(root, path, val){
  const parts = path.split("/").filter(Boolean);
  if (!parts.length) { for (const k of Object.keys(root)) delete root[k]; if (val && typeof val === "object") Object.assign(root, val); return; }
  let o = root;
  for (let i = 0; i < parts.length - 1; i++) { if (typeof o[parts[i]] !== "object" || !o[parts[i]]) { if (val === null) return; o[parts[i]] = {}; } o = o[parts[i]]; }
  const last = parts[parts.length - 1];
  if (val === null) delete o[last]; else o[last] = val;
}
// changes: {"spotId": obj|null, "spotId/t/c3": value|null, "spotId/name": "…"} — paths inside `spots`
function apply(changes){ for (const [p, v] of Object.entries(changes)) setPath(spots, p, clone(v)); }

/* ---------- shared undo/redo history ----------
   One history per room (or per device in private mode), so anyone can undo or redo what anyone did.
   Entry: {at, p: JSON string of {spotId: {b: {path: before}, a: {path: after}}}}. Stored as a string so
   paths with "/" and null values survive the database. Keys sort by time. */
let H = {hist:{}, redo:{}};
const HMAX = 120;
const parsed = new Map();
const parts = e => { if (!e || typeof e.p !== "string") return {}; let v = parsed.get(e.p); if (!v) { try { v = JSON.parse(e.p) || {}; } catch { v = {}; } parsed.set(e.p, v); } return v; };
// undo/redo only covers timer marks (kill / reset); renames, times, adding or removing respawns are not undoable
const isTimer = p => /^[^/]+\/t(\/|$)/.test(p);
function tparts(e){
  const out = {};
  for (const [id, part] of Object.entries(parts(e))) {
    if (!spots[id]) continue;                       // resp deleted since: nothing to restore
    const b = {}, a = {};
    for (const p of Object.keys(part.b || {})) if (isTimer(p)) { b[p] = part.b[p]; a[p] = (part.a || {})[p] ?? null; }
    if (Object.keys(b).length) out[id] = {b, a};
  }
  return out;
}
const hkey = () => String(Math.round(now())).padStart(14, "0") + "-" + uid();
const sortedKeys = o => Object.keys(o || {}).sort();
const latestWith = (o, id) => sortedKeys(o).reverse().find(k => { const t = tparts(o[k]); return id ? t[id] : Object.keys(t).length; });

// apply a room-level change set: "spots/…", "hist/…", "redo/…"
function doRoom(rc){
  for (const [p, v] of Object.entries(rc)) {
    if (p.startsWith("spots/")) setPath(spots, p.slice(6), clone(v));
    else if (p === "redo") H.redo = {};
    else if (p.startsWith("hist/") || p.startsWith("redo/")) setPath(H, p, clone(v));
  }
  if (online) push(rc); else store.set("spots", spots);
  const sc = {}; for (const [p, v] of Object.entries(rc)) if (p.startsWith("spots/")) sc[p.slice(6)] = v;
  refresh(sc);
}
function spotPaths(ps, side){ const rc = {}; for (const part of Object.values(ps)) for (const [p, v] of Object.entries(part[side] || {})) rc["spots/" + p] = v; return rc; }

function commit(changes, extra = {}){
  if (!Object.keys(changes).length) return;
  if (!Object.keys(changes).some(isTimer)) {           // not a timer change: apply without touching the history
    const rc = {...extra}; for (const [p, v] of Object.entries(changes)) rc["spots/" + p] = v;
    return doRoom(rc);
  }
  const ps = {};
  for (const p of Object.keys(changes).filter(isTimer)) {
    const id = p.split("/")[0], part = ps[id] || (ps[id] = {b:{}, a:{}});
    part.b[p] = clone(getPath(spots, p)); part.a[p] = clone(changes[p]);
  }
  const rc = {...extra};
  for (const [p, v] of Object.entries(changes)) rc["spots/" + p] = v;
  rc["hist/" + hkey()] = {at: Math.round(now()), p: JSON.stringify(ps)};
  if (Object.keys(H.redo).length) rc["redo"] = null;
  const ks = sortedKeys(H.hist); for (const k of ks.slice(0, Math.max(0, ks.length + 1 - HMAX))) rc["hist/" + k] = null;
  doRoom(rc);
}
function undo(){
  const k = latestWith(H.hist); if (!k) return;
  const ps = tparts(H.hist[k]);
  doRoom({...spotPaths(ps, "b"), ["hist/" + k]: null, ["redo/" + hkey()]: {at: Math.round(now()), p: JSON.stringify(ps)}});
  toast("Cofnięto");
}
function redo(){
  const k = latestWith(H.redo); if (!k) return;
  const ps = tparts(H.redo[k]);
  doRoom({...spotPaths(ps, "a"), ["redo/" + k]: null, ["hist/" + hkey()]: {at: Math.round(now()), p: JSON.stringify(ps)}});
  toast("Ponowiono");
}
// undo/redo only the part of the latest step that touched this resp
function spotStep(id, from, to, side, msg){
  const k = latestWith(H[from], id); if (!k) return;
  const ps = tparts(H[from][k]), part = ps[id], rest = {...ps}; delete rest[id];
  const rc = spotPaths({[id]: part}, side);
  rc[`${from}/${k}`] = Object.keys(rest).length ? {at: H[from][k].at, p: JSON.stringify(rest)} : null;
  rc[`${to}/${hkey()}`] = {at: Math.round(now()), p: JSON.stringify({[id]: part})};
  doRoom(rc);
  toast(msg + (spots[id] ? spots[id].name : "resp"));
}

const spotRedo = id => spotStep(id, "redo", "hist", "a", "Ponowiono: ");
function histIds(o){ const s = new Set(); for (const k of Object.keys(o || {})) for (const id of Object.keys(tparts(o[k]))) s.add(id); return s; }

const IN_APP = / MetinTimerApp/.test(navigator.userAgent);

const RELEASE_API = "https://api.github.com/repos/wronglogin/metin-timer/releases/latest";
const verNum = v => +String(v || "").replace(/^v?1\./, "") || 0;
// newest app release from GitHub, cached for 10 minutes (the API allows 60 requests per hour)
async function latestRelease(){
  const c = store.get("rel", null);
  if (c && Date.now() - c.t < 600000) return c;
  try {
    const r = await fetch(RELEASE_API, {headers: {Accept: "application/vnd.github+json"}}); if (!r.ok) return c;
    const j = await r.json(); const rel = {v: String(j.tag_name || "").replace(/^v/, ""), at: j.published_at, t: Date.now()};
    if (rel.v) store.set("rel", rel); return rel.v ? rel : c;
  } catch { return c; }
}
const fmtDate = iso => new Date(iso).toLocaleString("pl-PL", {day:"numeric", month:"long", year:"numeric", hour:"2-digit", minute:"2-digit"});
function appInfoHtml(rel){

  const latest = rel && rel.v ? `Najnowsza wersja: <b>${esc(rel.v)}</b>${when}.` : "Nie udało się sprawdzić najnowszej wersji.";

  if (rel && verNum(rel.v) > verNum(APP_VER)) return `<p>Twoja wersja: <b>${esc(APP_VER)}</b>. ${latest}</p><p>Pobierz nową i zainstaluj ją na obecną. Respy i ustawienia zostaną.</p>`;
  return `<p>Twoja wersja: <b>${esc(APP_VER)}</b>${rel && rel.v ? ` – to najnowsza${when}` : ""}.</p>`;
}
const APK_URL = "https://github.com/wronglogin/metin-timer/releases/latest/download/MetinTimer.apk";
const DB_URL = "https://timermetin-default-rtdb.europe-west1.firebasedatabase.app";
let remoteRoot = {};
function roomUrl(sub = ""){ return `${online.db}/rooms/${encodeURIComponent(online.room)}${sub}.json`; }
async function push(changes){
  try {
    const r = await fetch(roomUrl(), {method:"PATCH", headers:{"Content-Type":"application/json"}, body: JSON.stringify(changes)});
    if (!r.ok) throw new Error(r.status);
  } catch (e) { setMode("Błąd zapisu", "err"); }
}
async function syncClock(db){
  try {
    const key = `${db}/clock/${uid()}.json`, t0 = Date.now();
    const r = await fetch(key, {method:"PUT", body: JSON.stringify({".sv":"timestamp"})});
    const server = await r.json(), t1 = Date.now();
    if (typeof server === "number") clockOffset = server - (t0 + t1) / 2;
    fetch(key, {method:"DELETE"}).catch(() => {});
  } catch {}
}
async function connect(db, room){
  db = db.trim().replace(/\/+$/, ""); room = room.trim();
  if (await checkBan()) throw new Error("Admin zablokował ci dostęp do pokoi.");
  if (!/^https:\/\/[\w.-]+$/.test(db)) throw new Error("Adres bazy musi zaczynać się od https:// i nie mieć ścieżki.");
  if (!/^[\w-]{3,40}$/.test(room)) throw new Error("Nazwa pokoju: 3–40 znaków, litery, cyfry, - lub _.");
  disconnect(true);
  online = {db, room, es:null};
  setMode("Łączenie…");
  const test = await fetch(roomUrl("/spots")).catch(() => null);
  if (!test || !test.ok) { online = null; setMode("Prywatny"); throw new Error(test ? `Baza odmówiła dostępu (${test.status}). Sprawdź reguły bazy.` : "Brak połączenia z bazą."); }
  await syncClock(db);
  store.set("online", {db, room});
  remoteRoot = {}; H = {hist:{}, redo:{}};
  const es = new EventSource(roomUrl());
  online.es = es;
  const handle = kind => ev => {
    try {
      const {path, data} = JSON.parse(ev.data);
      if (kind === "put") setPath(remoteRoot, path, data);
      else for (const [k, v] of Object.entries(data || {})) setPath(remoteRoot, path.replace(/\/$/, "") + "/" + k, v);
      presence = remoteRoot.presence || {};
      const side = k => k.startsWith("presence") || k.startsWith("radio");
      const onlySide = side(path.slice(1)) || (path === "/" && kind === "patch" && Object.keys(data || {}).every(side));
      renderPresence();
      if (path === "/" || path.startsWith("/radio") || (kind === "patch" && Object.keys(data || {}).some(k => k.startsWith("radio")))) syncRadio(false);
      if (onlySide) return;
      spots = clone(remoteRoot.spots || {}) || {};
      H = {hist: clone(remoteRoot.hist || {}) || {}, redo: clone(remoteRoot.redo || {}) || {}};
      for (const s of Object.values(spots)) if (!s.t || typeof s.t !== "object") s.t = {};
      setMode("Pokój: " + room, "on");
      scheduleRender();
    } catch {}
  };
  es.addEventListener("put", handle("put"));
  es.addEventListener("patch", handle("patch"));
  es.addEventListener("cancel", () => setMode("Brak dostępu", "err"));
  es.addEventListener("auth_revoked", () => setMode("Brak dostępu", "err"));
  es.onerror = () => setMode("Wznawianie…", "err");
  es.onopen = () => setMode("Pokój: " + room, "on");
  startPresence();
}
function disconnect(silent){
  stopPresence();
  try { ytPlayer && ytPlayer.stopVideo(); } catch {}
  if (online && online.es) online.es.close();
  const was = !!online;
  online = null; clockOffset = 0;
  if (was && !silent) {
    store.set("online", null);
    spots = store.get("spots", null) || seedAll();
    H = {hist:{}, redo:{}};
    setMode("Prywatny"); render(); toast("Rozłączono. Wróciłeś do timerów prywatnych.");
  }
}
/* ---------- who is in the room ----------
   Each viewer writes rooms/<room>/presence/<deviceId> = {n: nick, t: server time} every 30 s.
   Entries newer than 75 s count as online; old ones are cleaned up when someone joins. */
let presence = {}, presenceTimer = null;
const deviceId = store.get("cid", null) || (() => { const id = uid(); store.set("cid", id); return id; })();
const myNick = () => String(store.get("nick", "") || "").trim();
const presUrl = id => roomUrl("/presence/" + id);
function heartbeat(){
  if (!online || !myNick()) return;
  fetch(presUrl(deviceId), {method:"PUT", headers:{"Content-Type":"application/json"}, body: JSON.stringify({n: myNick().slice(0, 20), t: {".sv":"timestamp"}})}).catch(() => {});
}
function startPresence(){
  stopPresence(true);
  heartbeat(); presenceTimer = setInterval(heartbeat, 30000);
  // tidy entries left behind by closed apps (older than 10 minutes)
  setTimeout(() => { const ch = {}; for (const [id, v] of Object.entries(presence)) if (!v || now() - (+v.t || 0) > 600000) ch["presence/" + id] = null;
    if (Object.keys(ch).length && online) fetch(roomUrl(), {method:"PATCH", headers:{"Content-Type":"application/json"}, body: JSON.stringify(ch)}).catch(() => {}); }, 4000);
}
function stopPresence(keepEntry){
  if (presenceTimer) clearInterval(presenceTimer); presenceTimer = null;
  if (!keepEntry && online) fetch(presUrl(deviceId), {method:"DELETE", keepalive:true}).catch(() => {});
  if (!keepEntry) { presence = {}; renderPresence(); }
}
window.addEventListener("pagehide", () => { if (online) fetch(presUrl(deviceId), {method:"DELETE", keepalive:true}).catch(() => {}); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && online) heartbeat(); });
function people(){
  return Object.entries(presence || {}).filter(([, v]) => v && v.n && now() - (+v.t || 0) < 75000)
    .map(([id, v]) => ({id, n: String(v.n).slice(0, 20), me: id === deviceId})).sort((a, b) => (b.me - a.me) || a.n.localeCompare(b.n, "pl"));
}
function renderPresence(){
  const el = document.getElementById("people"); if (!el) return;
  const list = online ? people() : [];

}

/* ---------- timers ---------- */
const SOON = 4 * 60000;
// daily reset: marks made before the latest 01:00 Polish time count as cleared (same on every device, no server job needed)
const RESET_HOUR = 1, RESET_TZ = "Europe/Warsaw";
function tzOffset(ts){
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", {timeZone: RESET_TZ, hourCycle: "h23", year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit"}).formatToParts(ts).map(x => [x.type, x.value]));
  return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second) - Math.floor(ts / 1000) * 1000;
}
function lastReset(ts){
  const wall = new Date(ts + tzOffset(ts));                     // Polish wall clock expressed as UTC fields
  let day = Date.UTC(wall.getUTCFullYear(), wall.getUTCMonth(), wall.getUTCDate(), RESET_HOUR);
  if (wall.getTime() < day) day -= 86400000;
  return day - tzOffset(day - tzOffset(day));                  // back to a real timestamp (handles DST)
}
let resetAt = 0;
const updateReset = () => { resetAt = lastReset(now()); };
function status(s, c){
  // a kill stores the respawn time valid at that moment: {a: timestamp, mn, mx}; editing the row only affects the next kill
  const v = s.t && s.t[c];
  if (!v) return {cls:"idle", text:"--:--", label:"nie liczy"};
  const t = typeof v === "number" ? v : v.a;
  if (t < resetAt) return {cls:"idle", text:"--:--", label:"nie liczy"};
  const el = now() - t, mn = (v.mn || s.min)*60000, mx = (v.mx || s.max)*60000;
  // neutral while counting, yellow in the last 4 minutes, blue once the counter is below zero
  if (el < mn - SOON) return {cls:"wait", text: fmt(mn - el), label:"odlicza", phase:0};
  if (el < mn) return {cls:"window", text: fmt(mn - el), label:"za chwilę", phase:1};
  return {cls:"ready", text: "-" + fmt(el - mn), label:"na minusie", phase:2};
}
function fmt(ms){
  const s = Math.max(0, Math.floor(ms / 1000)), m = Math.floor(s / 60), ss = s % 60;
  if (m >= 1000) return Math.floor(m / 60) + "h" + String(m % 60).padStart(2, "0");
  return String(m).padStart(2, "0") + ":" + String(ss).padStart(2, "0");
}

/* ---------- sound ---------- */
let actx = null;
let master = null;
function audio(){ try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); if (!master) { master = actx.createGain(); master.connect(actx.destination); } master.gain.value = settings.volume * settings.volume * 1.6; } catch {} return actx; }
function beep(kind = settings.sound, strong = false){
  if (!kind) return; const a = audio(); if (!a) return;
  if (kind === 4) return trumpet(a, strong);
  if (kind === 5) return playCustom(a, strong);
  const pats = {1:[[880,.12],[0,.08],[880,.12]], 2:[[523,.14],[659,.14],[784,.22]], 3:[[1200,.06],[0,.05],[1200,.06],[0,.05],[1200,.06]]};
  let t = a.currentTime + .02;
  for (let r = 0; r < (strong ? 2 : 1); r++) for (const [f, d] of pats[kind]) {
    if (f) { const o = a.createOscillator(), g = a.createGain(); o.type = kind === 2 ? "triangle" : "square"; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.25, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g).connect(master); o.start(t); o.stop(t + d + .02); }
    t += d + .03;
  }
}
/* ---------- voice announcements (device text-to-speech, Polish) ----------
   The Android app provides window.AndroidTTS; browsers use the Web Speech API. */
function speak(text){
  const vol = Math.max(0, Math.min(1, settings.volume));
  try { if (window.AndroidTTS) { window.AndroidTTS.speak(text, vol); return true; } } catch {}
  try {
    if (!("speechSynthesis" in window)) return false;
    const u = new SpeechSynthesisUtterance(text); u.lang = "pl-PL"; u.volume = vol; u.rate = 1.05;
    const v = speechSynthesis.getVoices().find(x => /^pl/i.test(x.lang)); if (v) u.voice = v;
    speechSynthesis.speak(u); return true;
  } catch { return false; }
}
const canSpeak = () => !!window.AndroidTTS || "speechSynthesis" in window;
// "Własny dźwięk": a file the viewer picked on this device, kept only in this browser
let customBuf = null;
async function loadCustom(){
  const url = store.get("customSound", null); if (!url) { customBuf = null; return null; }
  const a = audio(); if (!a) return null;
  try { const bin = Uint8Array.from(atob(url.split(",")[1]), c => c.charCodeAt(0)); customBuf = await a.decodeAudioData(bin.buffer); }
  catch { customBuf = null; }
  return customBuf;
}
async function playCustom(a, strong){
  const buf = customBuf || await loadCustom(); if (!buf) return;
  let t = a.currentTime + .02;
  for (let r = 0; r < (strong ? 2 : 1); r++) { const src = a.createBufferSource(); src.buffer = buf; src.connect(master); src.start(t); t += Math.min(buf.duration, 4) + .15; }
}
// original brass fanfare made from filtered sawtooth waves (no audio file)
function trumpet(a, strong){
  const notes = [[392,.11],[0,.04],[392,.11],[0,.04],[523,.16],[0,.03],[659,.16],[0,.03],[784,.55]];
  const out = a.createGain(); out.gain.value = .22; out.connect(master);
  let t = a.currentTime + .03;
  for (let r = 0; r < (strong ? 2 : 1); r++) {
    for (const [f, d] of notes) {
      if (f) {
        const g = a.createGain(), lp = a.createBiquadFilter(), vib = a.createOscillator(), vg = a.createGain();
        lp.type = "lowpass"; lp.Q.value = 6;
        lp.frequency.setValueAtTime(f * 1.5, t); lp.frequency.linearRampToValueAtTime(f * 7, t + .05); lp.frequency.linearRampToValueAtTime(f * 4, t + d);
        g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(1, t + .03); g.gain.setValueAtTime(.85, t + d - .04); g.gain.exponentialRampToValueAtTime(.0001, t + d + .06);
        vib.frequency.value = 5.5; vg.gain.value = d > .3 ? f * .012 : 0; vib.connect(vg);
        for (const det of [-6, 0, 6]) { const o = a.createOscillator(); o.type = "sawtooth"; o.frequency.value = f; o.detune.value = det; vg.connect(o.frequency); o.connect(lp); o.start(t); o.stop(t + d + .1); }
        vib.start(t); vib.stop(t + d + .1);
        lp.connect(g).connect(out);
      }
      t += d;
    }
    t += .25;
  }
}

function tick(){
  if (tick.n % 4 === 0) updateReset();
  if (view === "maps") document.querySelectorAll("[data-cell]").forEach(el => {
    const [id, c] = el.dataset.cell.split("|"), s = spots[id]; if (!s) return;
    const st = status(s, c), b = el.querySelector(".ct");
    // write to the page only when something changed, so a tap is never competing with redraws
    const cls = "cell " + st.cls;
    if (el.className !== cls) { el.className = cls; b.title = st.label; el.querySelector(".rs").disabled = st.cls === "idle"; }
    if (b.textContent !== st.text) { b.textContent = st.text; b.classList.toggle("long", st.text.length > 6); b.classList.toggle("mid", st.text.length === 6); }
  });
  let changed = false, strong = false; const said = [];
  for (const s of Object.values(spots)) for (const c of CHS()) {
    const k = s.id + ":" + c, st = status(s, c);
    if (st.phase == null || isHidden(s.map)) { delete alerted[k]; continue; }
    const v = s.t[c], key = (typeof v === "number" ? v : v.a) + ":" + st.phase;
    if (alerted[k] === undefined) { alerted[k] = key; continue; } // no beep for states found on load
    if (alerted[k] !== key) { alerted[k] = key; if (st.phase >= 1) { changed = true; strong = strong || st.phase === 2;
      said.push(`${s.name}, kanał ${c.slice(1)}, ${st.phase === 2 ? "stoi" : "za cztery minuty"}`); } }
  }

  if (changed) { if (strong) beep(settings.sound, false); if (settings.voice) setTimeout(() => said.forEach(speak), strong && settings.sound ? 900 : 0); }
  if (changed || tick.n++ % 8 === 0) renderTabs();
}

function editSheet(s){

  const ss = mapSpots(s.map), idx = ss.findIndex(x => x.id === s.id);
  sheet(`<h2>${esc(s.name)}</h2>
    <div class="field"><label for="e_kind">Rodzaj</label><select id="e_kind"><option value="metin">Metin</option><option value="boss"${s.kind === "boss" ? " selected" : ""}>Boss</option></select></div>
    <div class="field"><label>Kolor paska</label><div class="swatches"><button class="sw none" data-sw="" aria-label="Bez koloru" aria-pressed="${!s.color}"></button>${COLORS.map(c => `<button class="sw" data-sw="${c}" style="--c:${c}" aria-label="Kolor ${c}" aria-pressed="${c === s.color}"></button>`).join("")}</div></div>
    <div class="field"><label>Kolejność</label><div class="seg"><button id="e_up"${idx <= 0 ? " disabled" : ""}>Wyżej</button><button id="e_down"${idx >= ss.length - 1 ? " disabled" : ""}>Niżej</button></div></div>
    <div class="acts"><button class="btn danger grow" id="e_del">Usuń resp</button><button class="btn" data-close>Anuluj</button><button class="btn primary" id="e_ok">Zapisz</button></div>`,
  (el, close) => {
    el.querySelectorAll("[data-sw]").forEach(b => b.onclick = () => { color = b.dataset.sw || null; el.querySelectorAll("[data-sw]").forEach(x => x.setAttribute("aria-pressed", x === b)); });
    const swap = j => { const o = ss[j]; close(); commit({[`${s.id}/o`]: o.o, [`${o.id}/o`]: s.o === o.o ? s.o + (j < idx ? 1 : -1) : s.o}); };
    el.querySelector("#e_up").onclick = () => swap(idx - 1);
    el.querySelector("#e_down").onclick = () => swap(idx + 1);
    el.querySelector("#e_del").onclick = ev => { if (!ev.target.dataset.sure) { ev.target.dataset.sure = "1"; ev.target.textContent = "Na pewno? Tego nie da się cofnąć"; return; } close(); commit({[s.id]: null}); toast("Usunięto resp"); };
    el.querySelector("#e_ok").onclick = () => {
      const kind = el.querySelector("#e_kind").value, ch = {};
      if (kind !== s.kind) ch[`${s.id}/kind`] = kind;
      if ((color || null) !== (s.color || null)) ch[`${s.id}/color`] = color;
      close(); commit(ch);
    };
  });
}

/* ---------- export / import (own format + squadtimer.netlify.app) ----------
   squadtimer code = base64("name::minutes::%23color;;…###line_channel::respawnTimestamp;;…###")
   lines are 0-based, channels 1-based, the timestamp is when the metin respawns (start + minutes). */
const b64enc = t => btoa(unescape(encodeURIComponent(t)));
const b64dec = t => decodeURIComponent(escape(atob(String(t).trim().replace(/\s+/g, ""))));
const udec = t => { try { return decodeURIComponent(t); } catch { return t; } };
function parseSquad(text){
  const raw = b64dec(text);
  if (!raw.includes("###") || !raw.includes("::")) return null;
  const [linesPart, marksPart] = raw.split("###");
  const lines = linesPart.split(";;").filter(Boolean).map(l => { const [name, min] = l.split("::"); return {name: udec(name || "").slice(0, 40) || "Resp", min: Math.min(600, Math.max(1, Math.round(+min) || 1))}; });
  if (!lines.length) return null;
  for (const m of (marksPart || "").split(";;").filter(Boolean)) {
    const [key, ts] = m.split("::"), [li, chn] = key.split("_").map(Number), line = lines[li];
    if (!line || !(chn >= 1 && chn <= 10) || !(+ts > 0)) continue;
    const a = +ts - line.min * 60000;                     // their timestamp is the respawn moment; ours is the kill
    if (a > resetAt) (line.t = line.t || {})["c" + chn] = {a, mn: line.min, mx: line.min};
  }
  return lines;
}
function squadCode(mapId){
  const ss = mapSpots(mapId);
  const lines = ss.map(s => `${encodeURIComponent(s.name)}::${s.min}::%232a2a2a`).join(";;");
  const marks = [];
  ss.forEach((s, i) => { for (const [c, v] of Object.entries(s.t || {})) {
    const a = typeof v === "number" ? v : v && v.a, mn = (v && v.mn) || s.min;
    if (a > resetAt) marks.push(`${i}_${c.slice(1)}::${Math.round(a + mn * 60000)}`);
  } });
  return b64enc(`${lines}###${marks.join(";;")}###`);
}
const mapOptions = sel => visibleMaps().map(m => `<option value="${m.id}"${m.id === sel ? " selected" : ""}>${esc(m.name)}</option>`).join("");

}

// keep only well-formed channel marks that are still from today (after the 01:00 reset)
function importMarks(t){
  const out = {};
  for (const [c, v] of Object.entries(t && typeof t === "object" ? t : {})) {
    if (!/^c([1-9]|10)$/.test(c)) continue;
    const a = typeof v === "number" ? v : v && +v.a;
    if (!(a > resetAt)) continue;
    out[c] = {a, mn: Math.min(600, Math.max(1, +(v && v.mn) || 0)) || undefined, mx: Math.min(600, Math.max(1, +(v && v.mx) || 0)) || undefined};
    for (const k of ["mn", "mx"]) if (out[c][k] === undefined) delete out[c][k];
  }
  return out;
}
function importSheet(){
  sheet(`<h2>Importuj respy</h2><p>Wklej kod z tego timera albo ze squadtimera. Format rozpozna się sam.</p>
    <div class="field"><textarea id="i_code" placeholder="Wklej kod tutaj"></textarea></div>
    <div id="i_sq" class="field" hidden>
      <p id="i_sqinfo"></p>
      <label for="i_map">Wstaw na mapę</label><select id="i_map">${mapOptions(curMap())}</select>
      <div class="seg" style="margin-top:6px"><button data-mode="replace" aria-pressed="true">Zastąp respy tej mapy</button><button data-mode="add" aria-pressed="false">Dodaj do respów tej mapy</button></div>
    </div>
    <p id="i_own" hidden>Kod z tego timera: zastąpi wszystkie respy na wszystkich mapach.</p>
    <p style="font-size:13px">Importu nie da się cofnąć.</p>
    <p id="i_err" style="color:var(--danger)" hidden></p>
    <div class="acts"><button class="btn" data-close>Anuluj</button><button class="btn primary" id="i_ok">Importuj respy</button></div>`,
  (el, close) => {
    const ta = el.querySelector("#i_code"), err = el.querySelector("#i_err");
    let mode = "replace", kind = null, data = null;
    const detect = () => {
      kind = null; data = null; err.hidden = true;
      const v = ta.value.trim();
      if (v) {
        try { const arr = JSON.parse(b64dec(v)); if (Array.isArray(arr)) { kind = "own"; data = arr; } } catch {}
        if (!kind) try { const lines = parseSquad(v); if (lines) { kind = "squad"; data = lines; } } catch {}
      }
      el.querySelector("#i_sq").hidden = kind !== "squad";
      el.querySelector("#i_own").hidden = kind !== "own";
      if (kind === "squad") {
        const marks = data.reduce((n, l) => n + Object.keys(l.t || {}).length, 0);
        el.querySelector("#i_sqinfo").textContent = `Kod ze squadtimera: ${data.length} ${data.length === 1 ? "linia" : data.length < 5 ? "linie" : "linii"}, ${marks} ${marks === 1 ? "zaznaczony kanał" : "zaznaczonych kanałów"}.`;
      }
    };
    ta.addEventListener("input", detect);
    el.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { mode = b.dataset.mode; el.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", x === b)); });
    el.querySelector("#i_ok").onclick = () => {
      detect();
      if (!kind) { err.textContent = "Nie rozpoznaję tego kodu. Wklej cały kod z „Eksportuj” tego timera albo z „Eksportuj kod” squadtimera."; err.hidden = false; return; }
      const ch = {}; let n = 0;
      if (kind === "own") {
        for (const id of Object.keys(spots)) ch[id] = null;
        data.forEach((r, i) => { if (!mapById[r.map]) return; const id = uid(); n++;
          ch[id] = {id, map:r.map, name:String(r.name || "Resp").slice(0, 40), kind:r.kind === "boss" ? "boss" : "metin", min:+r.min || 10, max:+r.max || 20, color:COLORS.includes(r.color) ? r.color : null, o:+r.o || Date.now() + i, t:importMarks(r.t)}; });
      } else {
        const map = el.querySelector("#i_map").value, existing = mapSpots(map);
        if (mode === "replace") for (const s of existing) ch[s.id] = null;
        let o = mode === "add" && existing.length ? Math.max(...existing.map(s => s.o || 0)) + 1 : Date.now();
        for (const l of data) { const id = uid(); n++;
          ch[id] = {id, map, name:l.name, kind:"metin", min:l.min, max:l.min, color:null, o:o++, t:l.t || {}}; }
      }
      close(); commit(ch); toast("Zaimportowano " + n + " respów");
    };
  });
}
function resetSheet(){
  sheet(`<h2>Globalny reset</h2><p>Wyzeruje wszystkie liczniki na wszystkich mapach${online ? " dla całego pokoju" : ""}. Respy i ich nazwy zostają. Możesz to cofnąć.</p>

  (el, close) => el.querySelector("#r_ok").onclick = () => {
    const ch = {}; for (const s of Object.values(spots)) if (s.t && Object.keys(s.t).length) ch[`${s.id}/t`] = null;
    close(); commit(ch); toast("Wyzerowano liczniki");
  });
}
let toastT;
function toast(msg){
  let el = document.querySelector(".toast"); if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 2200);
}
let lock = null;
async function wake(){
  try {
    if (settings.wake && !lock && navigator.wakeLock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => lock = null); }
    if (!settings.wake && lock) { lock.release(); lock = null; }
  } catch {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { wake(); loadConfig(); } });

/* ---------- server config (admin) ---------- */
/* ---------- site password (like squadtimer's magic word) ----------

        <button class="rqplay" data-rq="${k}" title="Odtwórz teraz">${k === r.cur ? "▶ " : ""}${esc(it.t || titleCache[it.v] || "Wczytywanie tytułu…")}${it.by ? ` <span class="pme">· ${esc(it.by)}</span>` : ""}</button>
        <button class="btn" data-rqdel="${k}" aria-label="Usuń z kolejki">✕</button></li>`; }).join("") : '<li class="pme">Kolejka jest pusta.</li>';
    };
    draw(); const iv = setInterval(() => { if (!el.isConnected) return clearInterval(iv); draw(); }, 2000);
    const add = async () => {
      const inp = el.querySelector("#ra_url"), err = el.querySelector("#ra_err"); err.hidden = true;
      const btn = el.querySelector("#ra_add"); btn.disabled = true; btn.textContent = "Dodawanie…";
      const n = await addToRadio(inp.value);
      btn.disabled = false; btn.textContent = "Dodaj do kolejki";
      if (!n) { err.textContent = "Nie rozpoznaję linku. Wklej link do filmiku albo playlisty z YouTube."; err.hidden = false; return; }
      inp.value = ""; toast(n === 1 ? "Dodano do kolejki" : `Dodano ${n} utworów`); if (!radioOn) setRadioOn(true); draw();
    };
    el.querySelector("#ra_add").onclick = add;
    el.querySelector("#ra_url").addEventListener("keydown", e => { if (e.key === "Enter") add(); });
    el.querySelector("#ra_off").onclick = ev => { setRadioOn(!radioOn); ev.target.textContent = radioOn ? "Wyłącz radio u mnie" : "Włącz radio u mnie"; };
    el.querySelector("#ra_clear").onclick = ev => {
      if (!ev.target.dataset.sure) { ev.target.dataset.sure = 1; ev.target.textContent = "Na pewno wyczyścić?"; return; }
      radioPatch({queue: null, cur: null}); ev.target.dataset.sure = ""; ev.target.textContent = "Wyczyść kolejkę"; draw();
    };
    el.addEventListener("click", e => {
      const pl = e.target.closest("[data-rq]"); if (pl) { playKey(pl.dataset.rq); if (!radioOn) setRadioOn(true); draw(); return; }
      const del = e.target.closest("[data-rqdel]"); if (!del) return;
      const k = del.dataset.rqdel;
      if (RADIO().cur === k) stepRadio(1);
      radioPatch({[`queue/${k}`]: null}); draw();
    });
  });
}
document.getElementById("radio").addEventListener("click", e => {
  const b = e.target.closest("[data-radio]"); if (!b) return;
  const a = b.dataset.radio;
  if (a === "on") setRadioOn(true);
  else if (a === "mute") { radioMuted = !radioMuted; store.set("radioMuted", radioMuted); applyMute(); renderRadio(); }
  else if (a === "prev") stepRadio(-1);
  else if (a === "next") stepRadio(1);
  else if (a === "queue") radioSheet();
});
setInterval(() => { if (online && radioOn && ytReady) syncRadio(false); }, 5000);

/* ---------- boot ---------- */
const saved = store.get("spots", null);
spots = saved && typeof saved === "object" ? saved : seedAll();
for (const s of Object.values(spots)) if (!s.t || typeof s.t !== "object") s.t = {};
if (saved && !store.get("noColorsV1", false)) { for (const s of Object.values(spots)) s.color = null; store.set("spots", spots); }
if (!store.get("noColorsV1", false)) { settings.sound = 0; store.set("settings", settings); }
store.set("noColorsV1", true);
if (!saved) store.set("spots", spots);
updateReset(); render(); setInterval(tick, 250); wake();
loadConfig(); setInterval(loadConfig, 60000);
document.getElementById("roomSel").addEventListener("change", e => switchRoom(e.target.value));
document.getElementById("people").addEventListener("click", e => { e.stopPropagation(); e.currentTarget.classList.toggle("open"); });
document.addEventListener("click", () => document.getElementById("people").classList.remove("open"));
renderRoomSel();
// inside the app: tell once per new version that an update is available
if (IN_APP) setTimeout(async () => {
  const rel = await latestRelease();
  if (rel && verNum(rel.v) > verNum(APP_VER || "1.0") && store.get("updNotice", "") !== rel.v) {
    store.set("updNotice", rel.v); toast(`Jest nowa wersja aplikacji ${rel.v}. Pobierzesz ją w Menu.`);
  }
}, 3000);
const auto = store.get("online", null);
// rooms connect only after the site password was entered
afterUnlock.push(() => {
  if (!(auto && auto.room) || online) return;
  // nick is required in rooms: ask for it once if this device joined before nicks existed
  if (!myNick()) { store.set("online", null); setTimeout(() => { menuSheet(); toast("Wpisz swój nick, żeby wrócić do pokoju " + auto.room); }, 300); return; }
  connect(DB_URL, auto.room).catch(() => setMode("Prywatny"));
});
gate();
})();
</script>
