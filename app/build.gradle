plugins { id 'com.android.application' }

def vc = (project.findProperty('vc') ?: '1') as Integer

android {
    namespace 'pl.metintimer.app'
    compileSdk 35
    defaultConfig {
        applicationId 'pl.metintimer.app'
        minSdk 24
        targetSdk 35
        versionCode vc
        versionName "1.${vc}"
    }
    signingConfigs {
        release {
            // stały klucz: każda nowa wersja instaluje się na poprzednią
            storeFile file('release.jks')
            // hasło przychodzi z sekretu GitHuba KEYSTORE_PASSWORD, nie z repozytorium
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: ''
            keyAlias 'metin'
            keyPassword System.getenv('KEYSTORE_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig (file('release.jks').exists() && System.getenv('KEYSTORE_PASSWORD')) ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
